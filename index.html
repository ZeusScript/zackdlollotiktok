<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <!-- Ottimizzazione per Mobile: disabilita lo zoom e fissa la viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Brawl Clone HTML5</title>
    <style>
        /* CSS RESET & MOBILE OPTIMIZATION */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none; /* Previene la selezione del testo su mobile */
            -webkit-user-select: none;
            touch-action: none; /* Blocca lo scroll della pagina su mobile */
        }
        
        body, html {
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI STRATO SUPERIORE */
        #uiLayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Fa passare i tocchi al canvas */
        }

        .btn {
            position: absolute;
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid #fff;
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            backdrop-filter: blur(4px);
        }

        #fullscreenBtn {
            top: 20px;
            right: 20px;
        }

        #scoreBoard {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffcc00;
            font-size: 24px;
            font-weight: 900;
            text-shadow: 2px 2px 0 #000;
        }

        #gameOverScreen {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            color: white;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            pointer-events: auto;
        }

        #gameOverScreen h1 {
            font-size: 48px;
            color: #ff4444;
            margin-bottom: 20px;
        }

        #restartBtn {
            position: relative;
            font-size: 20px;
            padding: 15px 30px;
            background: #ffcc00;
            color: black;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Area di Gioco -->
    <canvas id="gameCanvas"></canvas>

    <!-- UI Overlay -->
    <div id="uiLayer">
        <div id="scoreBoard">Gemme: <span id="scoreValue">0</span></div>
        <button id="fullscreenBtn" class="btn">Schermo Intero</button>
    </div>

    <!-- Game Over Screen -->
    <div id="gameOverScreen">
        <h1>SEI STATO SCONFITTO!</h1>
        <p>Gemme raccolte: <span id="finalScore">0</span></p><br>
        <button id="restartBtn" class="btn">GIOCA ANCORA</button>
    </div>

    <script>
        /**
         * BRAWL CLONE ENGINE - Scritto in JS Puro
         * Architettura: Loop di gioco (Update -> Draw), Entità OOP, Input Touch Multiplo
         */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('scoreValue');
        
        let width, height;
        let gameActive = true;
        let score = 0;

        // Adatta il canvas alla finestra
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- SISTEMA DI INPUT (DOPPIO JOYSTICK) ---
        const input = {
            left: { active: false, id: null, startX: 0, startY: 0, currX: 0, currY: 0, vectorX: 0, vectorY: 0 },
            right: { active: false, id: null, startX: 0, startY: 0, currX: 0, currY: 0, vectorX: 0, vectorY: 0, angle: 0 }
        };

        const maxJoyRadius = 50; // Dimensione massima joystick virtuale

        // Gestione Touch
        canvas.addEventListener('touchstart', handleTouchStart, {passive: false});
        canvas.addEventListener('touchmove', handleTouchMove, {passive: false});
        canvas.addEventListener('touchend', handleTouchEnd, {passive: false});
        canvas.addEventListener('touchcancel', handleTouchEnd, {passive: false});

        function handleTouchStart(e) {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                if (t.clientX < width / 2 && !input.left.active) {
                    // Tocco a sinistra = Movimento
                    input.left.active = true;
                    input.left.id = t.identifier;
                    input.left.startX = input.left.currX = t.clientX;
                    input.left.startY = input.left.currY = t.clientY;
                } else if (t.clientX >= width / 2 && !input.right.active) {
                    // Tocco a destra = Mira
                    input.right.active = true;
                    input.right.id = t.identifier;
                    input.right.startX = input.right.currX = t.clientX;
                    input.right.startY = input.right.currY = t.clientY;
                }
            }
        }

        function handleTouchMove(e) {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                if (input.left.active && t.identifier === input.left.id) {
                    input.left.currX = t.clientX;
                    input.left.currY = t.clientY;
                    updateJoyVector(input.left);
                } else if (input.right.active && t.identifier === input.right.id) {
                    input.right.currX = t.clientX;
                    input.right.currY = t.clientY;
                    updateJoyVector(input.right);
                    input.right.angle = Math.atan2(input.right.vectorY, input.right.vectorX);
                }
            }
        }

        function handleTouchEnd(e) {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                if (input.left.active && t.identifier === input.left.id) {
                    input.left.active = false;
                    input.left.vectorX = input.left.vectorY = 0;
                } else if (input.right.active && t.identifier === input.right.id) {
                    // SPARA QUANDO RILASCI IL JOYSTICK DESTRO
                    if (Math.hypot(input.right.vectorX, input.right.vectorY) > 0.2) {
                        player.shoot(input.right.angle);
                    }
                    input.right.active = false;
                    input.right.vectorX = input.right.vectorY = 0;
                }
            }
        }

        function updateJoyVector(joy) {
            let dx = joy.currX - joy.startX;
            let dy = joy.currY - joy.startY;
            let dist = Math.hypot(dx, dy);
            if (dist > maxJoyRadius) {
                dx = (dx / dist) * maxJoyRadius;
                dy = (dy / dist) * maxJoyRadius;
            }
            joy.vectorX = dx / maxJoyRadius;
            joy.vectorY = dy / maxJoyRadius;
        }

        // --- ENTITÀ DI GIOCO ---

        class Player {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 20;
                this.speed = 4;
                this.color = '#00aaff';
                this.hp = 100;
                this.maxHp = 100;
                this.cooldown = 0;
            }

            update() {
                // Movimento tramite joystick sinistro
                if (input.left.active) {
                    this.x += input.left.vectorX * this.speed;
                    this.y += input.left.vectorY * this.speed;
                }

                // Confini dell'arena
                this.x = Math.max(this.radius, Math.min(width - this.radius, this.x));
                this.y = Math.max(this.radius, Math.min(height - this.radius, this.y));

                if (this.cooldown > 0) this.cooldown--;
            }

            draw() {
                // Corpo Brawler
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.strokeStyle = '#005588';
                ctx.lineWidth = 3;
                ctx.stroke();

                // Barra della vita
                const hpPercent = this.hp / this.maxHp;
                ctx.fillStyle = 'red';
                ctx.fillRect(this.x - 20, this.y - 35, 40, 8);
                ctx.fillStyle = '#00ff00';
                ctx.fillRect(this.x - 20, this.y - 35, 40 * hpPercent, 8);

                // Disegna indicatore di mira (Joystick destro)
                if (input.right.active) {
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y);
                    ctx.lineTo(this.x + Math.cos(input.right.angle) * 100, this.y + Math.sin(input.right.angle) * 100);
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                    ctx.setLineDash([5, 5]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
            }

            shoot(angle) {
                if (this.cooldown <= 0) {
                    bullets.push(new Bullet(this.x, this.y, angle));
                    this.cooldown = 15; // Rateo di fuoco
                }
            }
        }

        class Bullet {
            constructor(x, y, angle) {
                this.x = x;
                this.y = y;
                this.vx = Math.cos(angle) * 12;
                this.vy = Math.sin(angle) * 12;
                this.radius = 6;
                this.color = '#ffff00';
                this.distance = 0;
                this.maxDistance = 500;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.distance += Math.hypot(this.vx, this.vy);
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        class Enemy {
            constructor() {
                // Spawna fuori dallo schermo
                const side = Math.random();
                if (side < 0.25) { this.x = -30; this.y = Math.random() * height; }
                else if (side < 0.5) { this.x = width + 30; this.y = Math.random() * height; }
                else if (side < 0.75) { this.x = Math.random() * width; this.y = -30; }
                else { this.x = Math.random() * width; this.y = height + 30; }
                
                this.radius = 20;
                this.speed = Math.random() * 1.5 + 1;
                this.hp = 30;
                this.color = '#ff3333';
            }

            update() {
                // Insegui il giocatore (IA Base)
                const dx = player.x - this.x;
                const dy = player.y - this.y;
                const angle = Math.atan2(dy, dx);
                this.x += Math.cos(angle) * this.speed;
                this.y += Math.sin(angle) * this.speed;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.strokeStyle = '#880000';
                ctx.lineWidth = 3;
                ctx.stroke();
            }
        }

        // --- INIZIALIZZAZIONE E LOOP ---
        let player = new Player(width / 2, height / 2);
        let bullets = [];
        let enemies = [];
        let particles = [];
        let frameCount = 0;

        function init() {
            player = new Player(width / 2, height / 2);
            bullets = [];
            enemies = [];
            score = 0;
            scoreEl.innerText = score;
            gameActive = true;
            document.getElementById('gameOverScreen').style.display = 'none';
            loop();
        }

        function drawJoysticks() {
            ctx.lineWidth = 2;
            if (input.left.active) {
                ctx.beginPath();
                ctx.arc(input.left.startX, input.left.startY, maxJoyRadius, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(input.left.currX, input.left.currY, 20, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.fill();
            }
            if (input.right.active) {
                ctx.beginPath();
                ctx.arc(input.right.startX, input.right.startY, maxJoyRadius, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255, 50, 50, 0.3)';
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(input.right.currX, input.right.currY, 20, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 50, 50, 0.5)';
                ctx.fill();
            }
        }

        function loop() {
            if (!gameActive) return;
            requestAnimationFrame(loop);
            
            // Background stile prato/arena
            ctx.fillStyle = '#228B22';
            ctx.fillRect(0, 0, width, height);
            
            // Griglia terreno (effetto visuale)
            ctx.strokeStyle = 'rgba(0,0,0,0.1)';
            ctx.lineWidth = 1;
            for(let i=0; i<width; i+=50) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,height); ctx.stroke(); }
            for(let i=0; i<height; i+=50) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(width,i); ctx.stroke(); }

            player.update();
            player.draw();

            // Aggiorna proiettili
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.update();
                b.draw();
                
                // Rimuovi se fuori range
                if (b.distance > b.maxDistance || b.x < 0 || b.x > width || b.y < 0 || b.y > height) {
                    bullets.splice(i, 1);
                }
            }

            // Spawn nemici
            if (frameCount % 60 === 0) { // 1 nemico al secondo (circa)
                enemies.push(new Enemy());
            }

            // Aggiorna nemici e Collisioni
            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                e.update();
                e.draw();

                // Danno al player
                const distToPlayer = Math.hypot(player.x - e.x, player.y - e.y);
                if (distToPlayer < player.radius + e.radius) {
                    player.hp -= 1;
                    if (player.hp <= 0) {
                        gameActive = false;
                        document.getElementById('finalScore').innerText = score;
                        document.getElementById('gameOverScreen').style.display = 'flex';
                    }
                }

                // Collisione proiettile-nemico
                for (let j = bullets.length - 1; j >= 0; j--) {
                    let b = bullets[j];
                    const dist = Math.hypot(e.x - b.x, e.y - b.y);
                    if (dist < e.radius + b.radius) {
                        e.hp -= 15; // Danno proiettile
                        bullets.splice(j, 1); // Rimuovi proiettile
                        
                        if (e.hp <= 0) {
                            enemies.splice(i, 1);
                            score += 1;
                            scoreEl.innerText = score;
                            break; // Nemico morto, passa al prossimo
                        }
                    }
                }
            }

            drawJoysticks();
            frameCount++;
        }

        // Fullscreen API Wrapper
        document.getElementById('fullscreenBtn').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Errore Fullscreen: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        });

        document.getElementById('restartBtn').addEventListener('click', init);

        // Avvia!
        init();

    </script>
</body>
</html>
