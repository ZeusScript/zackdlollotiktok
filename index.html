<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zackdis - Contattaci</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .contact-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 30px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }
    .contact-card h2 {
      margin-bottom: 8px;
      color: #38bdf8;
    }
    .contact-card p {
      font-size: 0.9em;
      color: #94a3b8;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-size: 0.85em;
      font-weight: 600;
      margin-bottom: 6px;
      color: #cbd5e1;
    }
    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #475569;
      background-color: #0f172a;
      color: #fff;
      font-size: 0.95em;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus,
    .form-group textarea:focus {
      border-color: #38bdf8;
    }
    .submit-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background-color: #5865f2; /* Colore Discord */
      color: white;
      font-weight: bold;
      font-size: 1em;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .submit-btn:hover {
      background-color: #4752c4;
    }
    .submit-btn:disabled {
      background-color: #475569;
      cursor: not-allowed;
    }
    #form-status {
      margin-top: 15px;
      font-size: 0.9em;
      text-align: center;
      display: none;
      padding: 10px;
      border-radius: 6px;
    }
    .status-success {
      background-color: rgba(34, 197, 94, 0.1);
      color: #4ade80;
      border: 1px solid #22c55e;
    }
    .status-error {
      background-color: rgba(239, 68, 68, 0.1);
      color: #f87171;
      border: 1px solid #ef4444;
    }
  </style>
</head>
<body>

  <div class="contact-card">
    <h2>Zackdis Supporto</h2>
    <p>Compila il modulo per inviarci un messaggio diretto nel server Discord.</p>

    <form id="zackdis-form">
      <div class="form-group">
        <label for="name">Nome / Nickname</label>
        <input type="text" id="name" required placeholder="Inserisci il tuo nome">
      </div>

      <div class="form-group">
        <label for="email">Indirizzo Email</label>
        <input type="email" id="email" required placeholder="tuamail@esempio.com">
      </div>

      <div class="form-group">
        <label for="subject">Oggetto</label>
        <input type="text" id="subject" required placeholder="Motivo del contatto">
      </div>

      <div class="form-group">
        <label for="message">Messaggio</label>
        <textarea id="message" rows="4" required placeholder="Scrivi qui il tuo messaggio..."></textarea>
      </div>

      <button type="submit" id="submit-btn" class="submit-btn">Invia Messaggio</button>
      <div id="form-status"></div>
    </form>
  </div>

  <script>
    document.getElementById('zackdis-form').addEventListener('submit', async function(e) {
      e.preventDefault();

      const btn = document.getElementById('submit-btn');
      const status = document.getElementById('form-status');

      btn.disabled = true;
      btn.innerText = 'Invio in corso...';
      status.style.display = 'none';

      const payload = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        subject: document.getElementById('subject').value,
        message: document.getElementById('message').value
      };

      try {
        const response = await fetch('https://hook.eu1.make.com/ok6vt2okfl5u7rxe399tx06yzpc83qv6', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          status.className = 'status-success';
          status.innerText = '✅ Messaggio inviato con successo!';
          status.style.display = 'block';
          document.getElementById('zackdis-form').reset();
        } else {
          throw new Error('Errore nella risposta del server');
        }
      } catch (err) {
        status.className = 'status-error';
        status.innerText = '❌ Si è verificato un errore. Riprova più tardi.';
        status.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.innerText = 'Invia Messaggio';
      }
    });
  </script>

</body>
</html>
