    <!-- SCRIPT POPOLAMENTO GRIGLIE -->
    <script>
        function populateBrawlerScreen() {
            const container = document.getElementById('brawlerGridContainer');
            container.innerHTML = '';
            GAME_DATABASE.brawlers.forEach(b => {
                const isSelected = playerProfile.selectedBrawlerId === b.id;
                container.innerHTML += `
                    <div class="card-item ${isSelected ? 'selected' : ''} ${!b.unlocked ? 'locked' : ''}" onclick="selectBrawler('${b.id}')">
                        <div class="card-emoji-box">${b.emoji}</div>
                        <div class="card-name">${b.name}</div>
                        <div class="card-status" style="color: ${b.unlocked ? 'var(--success-green)' : 'var(--brawl-yellow)'}">
                            ${b.unlocked ? 'LIV ' + b.level : '💎 ' + b.price}
                        </div>
                    </div>
                `;
            });
        }

        function populateShopScreen() {
            const container = document.getElementById('shopGridContainer');
            container.innerHTML = '';
            GAME_DATABASE.shopItems.forEach(item => {
                container.innerHTML += `
                    <div class="card-item" onclick="buyShopItem('${item.id}')">
                        <div class="card-emoji-box">${item.emoji}</div>
                        <div class="card-name">${item.name}</div>
                        <button class="brawl-btn" style="padding: 6px 12px; font-size: 0.9rem; margin-top: 5px;">💎 ${item.priceGems}</button>
                    </div>
                `;
            });
            document.getElementById('shopGemsSync').innerText = playerProfile.gems;
        }

        function populateMapScreen() {
            const container = document.getElementById('mapGridContainer');
            container.innerHTML = '';
            GAME_DATABASE.maps.forEach(m => {
                const isSelected = playerProfile.selectedMapId === m.id;
                container.innerHTML += `
                    <div class="card-item ${isSelected ? 'selected' : ''}" onclick="selectMap('${m.id}')" style="background: linear-gradient(135deg, ${m.bgTheme}, #161622);">
                        <div class="card-emoji-box" style="background: rgba(0,0,0,0.5);">🗺️</div>
                        <div class="card-name">${m.name}</div>
                        <div class="card-status" style="color: var(--brawl-blue);">${m.mode}</div>
                    </div>
                `;
            });
        }

        function selectBrawler(id) {
            const b = GAME_DATABASE.brawlers.find(x => x.id === id);
            if(!b) return;
            if(b.unlocked) {
                playerProfile.selectedBrawlerId = id;
                updateLobbyDisplay();
                populateBrawlerScreen();
            } else {
                if(playerProfile.gems >= b.price) {
                    playerProfile.gems -= b.price;
                    b.unlocked = true;
                    playerProfile.selectedBrawlerId = id;
                    updateLobbyDisplay();
                    populateBrawlerScreen();
                    alert("Brawler sbloccato con successo!");
                } else {
                    alert("Non hai abbastanza gemme!");
                }
            }
        }

        function selectMap(id) {
            playerProfile.selectedMapId = id;
            updateLobbyDisplay();
            populateMapScreen();
            switchScreen('lobbyScreen');
        }

        function buyShopItem(id) {
            const item = GAME_DATABASE.shopItems.find(x => x.id === id);
            if(!item) return;
            if(playerProfile.gems >= item.priceGems) {
                playerProfile.gems -= item.priceGems;
                updateLobbyDisplay();
                populateShopScreen();
                alert(`Hai acquistato: ${item.name}!`);
            } else {
                alert("Gemme insufficienti!");
            }
        }

        // Inizializza griglie al caricamento

        populateShopScreen();

    <!-- MOTORE JAVASCRIPT DI GIOCO (CANVAS + TOUCH JOYSTICKS) -->
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let canvasWidth, canvasHeight;
        let matchActive = false;
        let matchScoreVal = 0;
        let matchAnimationId;

        function resizeCanvas() {
            canvasWidth = window.innerWidth;
            canvasHeight = window.innerHeight;
            canvas.width = canvasWidth;
            canvas.height = canvasHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Controllo Touch Dual Joystick
        const joystickData = {
            left: { active: false, id: null, startX: 0, startY: 0, currX: 0, currY: 0, vecX: 0, vecY: 0 },
            right: { active: false, id: null, startX: 0, startY: 0, currX: 0, currY: 0, vecX: 0, vecY: 0, angle: 0 }
        };
        const maxJoyDist = 55;

        canvas.addEventListener('touchstart', handleMatchTouchStart, {passive: false});
        canvas.addEventListener('touchmove', handleMatchTouchMove, {passive: false});
        canvas.addEventListener('touchend', handleMatchTouchEnd, {passive: false});
        canvas.addEventListener('touchcancel', handleMatchTouchEnd, {passive: false});

        function handleMatchTouchStart(e) {
            if (!matchActive) return;
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                if (t.clientX < canvasWidth / 2 && !joystickData.left.active) {
                    joystickData.left.active = true;
                    joystickData.left.id = t.identifier;
                    joystickData.left.startX = joystickData.left.currX = t.clientX;
                    joystickData.left.startY = joystickData.left.currY = t.clientY;
                } else if (t.clientX >= canvasWidth / 2 && !joystickData.right.active) {
                    joystickData.right.active = true;
                    joystickData.right.id = t.identifier;
                    joystickData.right.startX = joystickData.right.currX = t.clientX;
                    joystickData.right.startY = joystickData.right.currY = t.clientY;
                }
            }
        }

        function handleMatchTouchMove(e) {
            if (!matchActive) return;
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                if (joystickData.left.active && t.identifier === joystickData.left.id) {
                    joystickData.left.currX = t.clientX;
                    joystickData.left.currY = t.clientY;
                    updateJoyVector(joystickData.left);
                } else if (joystickData.right.active && t.identifier === joystickData.right.id) {
                    joystickData.right.currX = t.clientX;
                    joystickData.right.currY = t.clientY;
                    updateJoyVector(joystickData.right);
                    joystickData.right.angle = Math.atan2(joystickData.right.vecY, joystickData.right.vecX);
                }
            }
        }

        function handleMatchTouchEnd(e) {
            if (!matchActive) return;
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                if (joystickData.left.active && t.identifier === joystickData.left.id) {
                    joystickData.left.active = false;
                    joystickData.left.vecX = joystickData.left.vecY = 0;
                } else if (joystickData.right.active && t.identifier === joystickData.right.id) {
                    if (Math.hypot(joystickData.right.vecX, joystickData.right.vecY) > 0.2) {
                        playerEntity.shoot(joystickData.right.angle);
                    }
                    joystickData.right.active = false;
                    joystickData.right.vecX = joystickData.right.vecY = 0;
                }
            }
        }

        function updateJoyVector(joy) {
            let dx = joy.currX - joy.startX;
            let dy = joy.currY - joy.startY;
            let dist = Math.hypot(dx, dy);
            if (dist > maxJoyDist) {
                dx = (dx / dist) * maxJoyDist;
                dy = (dy / dist) * maxJoyDist;
            }
            joy.vecX = dx / maxJoyDist;
            joy.vecY = dy / maxJoyDist;
        }

        // Entità di Gioco
        class GamePlayer {
            constructor(x, y, stats) {
                this.x = x;
                this.y = y;
                this.radius = 22;
                this.speed = stats.speed;
                this.hp = stats.hp;
                this.maxHp = stats.hp;
                this.color = stats.color;
                this.emoji = stats.emoji;
                this.cooldown = 0;
            }

            update() {
                if (joystickData.left.active) {
                    this.x += joystickData.left.vecX * this.speed;
                    this.y += joystickData.left.vecY * this.speed;
                }
                this.x = Math.max(this.radius, Math.min(canvasWidth - this.radius, this.x));
                this.y = Math.max(this.radius, Math.min(canvasHeight - this.radius, this.y));
                if (this.cooldown > 0) this.cooldown--;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();

                // Barra HP
                let hpW = 40;
                let hpPct = this.hp / this.maxHp;
                ctx.fillStyle = '#ff3344';
                ctx.fillRect(this.x - hpW/2, this.y - 34, hpW, 6);
                ctx.fillStyle = '#00e676';
                ctx.fillRect(this.x - hpW/2, this.y - 34, hpW * hpPct, 6);

                // Linea di mira joystick destro
                if (joystickData.right.active) {
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y);
                    ctx.lineTo(this.x + Math.cos(joystickData.right.angle) * 80, this.y + Math.sin(joystickData.right.angle) * 80);
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
                    ctx.setLineDash([4, 4]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
            }

            shoot(angle) {
                if (this.cooldown <= 0) {
                    matchBullets.push(new Bullet(this.x, this.y, angle));
                    this.cooldown = 12;
                }
            }
        }

        class Bullet {
            constructor(x, y, angle) {
                this.x = x;
                this.y = y;
                this.vx = Math.cos(angle) * 14;
                this.vy = Math.sin(angle) * 14;
                this.radius = 6;
                this.distTravelled = 0;
                this.maxDist = 450;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.distTravelled += Math.hypot(this.vx, this.vy);
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#ffd700';
                ctx.fill();
            }
        }

        class BotEnemy {
            constructor() {
                let side = Math.random();
                if (side < 0.25) { this.x = -30; this.y = Math.random() * canvasHeight; }
                else if (side < 0.5) { this.x = canvasWidth + 30; this.y = Math.random() * canvasHeight; }
                else if (side < 0.75) { this.x = Math.random() * canvasWidth; this.y = -30; }
                else { this.x = Math.random() * canvasWidth; this.y = canvasHeight + 30; }
                this.radius = 20;
                this.speed = 2.2;
                this.hp = 40;
            }
            update(targetX, targetY) {
                let dx = targetX - this.x;
                let dy = targetY - this.y;
                let angle = Math.atan2(dy, dx);
                this.x += Math.cos(angle) * this.speed;
                this.y += Math.sin(angle) * this.speed;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#ff3344';
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#660000';
                ctx.stroke();
            }
        }

        let playerEntity;
        let matchBullets = [];
        let matchEnemies = [];
        let frameCounter = 0;
        let currentMapConfig;

        // Sovrascriviamo la funzione startMatch della lobby precedente
        window.startMatch = function() {
            const bData = GAME_DATABASE.brawlers.find(x => x.id === playerProfile.selectedBrawlerId);
            currentMapConfig = GAME_DATABASE.maps.find(x => x.id === playerProfile.selectedMapId);
            
            playerEntity = new GamePlayer(canvasWidth / 2, canvasHeight / 2, bData);
            matchBullets = [];
            matchEnemies = [];
            matchScoreVal = 0;
            frameCounter = 0;
            document.getElementById('matchScore').innerText = matchScoreVal;
            document.getElementById('gameOverOverlay').style.display = 'none';

            switchScreen('gameScreen');
            matchActive = true;
            matchLoop();
        }

        function matchLoop() {
            if (!matchActive) return;
            matchAnimationId = requestAnimationFrame(matchLoop);

            // Sfondo personalizzato in base alla mappa
            ctx.fillStyle = currentMapConfig ? currentMapConfig.bgTheme : '#1a0b2e';
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);

            // Griglia di sfondo opzionale
            ctx.strokeStyle = 'rgba(255,255,255,0.03)';
            ctx.lineWidth = 1;
            for(let i=0; i<canvasWidth; i+=60) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvasHeight); ctx.stroke(); }
            for(let i=0; i<canvasHeight; i+=60) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(canvasWidth,i); ctx.stroke(); }

            playerEntity.update();
            playerEntity.draw();

            // Aggiorna proiettili
            for (let i = matchBullets.length - 1; i >= 0; i--) {
                let b = matchBullets[i];
                b.update();
                b.draw();
                if (b.distTravelled > b.maxDist || b.x < 0 || b.x > canvasWidth || b.y < 0 || b.y > canvasHeight) {
                    matchBullets.splice(i, 1);
                }
            }

            // Spawn nemici
            if (frameCounter % 50 === 0) {
                matchEnemies.push(new BotEnemy());
            }

            // Aggiorna nemici e collisioni
            for (let i = matchEnemies.length - 1; i >= 0; i--) {
                let en = matchEnemies[i];
                en.update(playerEntity.x, playerEntity.y);
                en.draw();

                // Danno al player
                if (Math.hypot(playerEntity.x - en.x, playerEntity.y - en.y) < playerEntity.radius + en.radius) {
                    playerEntity.hp -= 1.5;
                    if (playerEntity.hp <= 0) {
                        endMatch();
                    }
                }

                // Collisione proiettile-nemico
                for (let j = matchBullets.length - 1; j >= 0; j--) {
                    let b = matchBullets[j];
                    if (Math.hypot(en.x - b.x, en.y - b.y) < en.radius + b.radius) {
                        en.hp -= 35;
                        matchBullets.splice(j, 1);
                        if (en.hp <= 0) {
                            matchEnemies.splice(i, 1);
                            matchScoreVal += 1;
                            document.getElementById('matchScore').innerText = matchScoreVal;
                            break;
                        }
                    }
                }
            }

            // Disegna Joystick Virtuali su schermo se attivi
            drawVirtualJoysticks();
            frameCounter++;
        }

        function drawVirtualJoysticks() {
            ctx.lineWidth = 2;
            if (joystickData.left.active) {
                ctx.beginPath();
                ctx.arc(joystickData.left.startX, joystickData.left.startY, maxJoyDist, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(joystickData.left.currX, joystickData.left.currY, 22, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.fill();
            }
            if (joystickData.right.active) {
                ctx.beginPath();
                ctx.arc(joystickData.right.startX, joystickData.right.startY, maxJoyDist, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255, 50, 80, 0.3)';
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(joystickData.right.currX, joystickData.right.currY, 22, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 50, 80, 0.5)';
                ctx.fill();
            }
        }

        function endMatch() {
            matchActive = false;
            cancelAnimationFrame(matchAnimationId);
            document.getElementById('finalMatchScore').innerText = matchScoreVal;
            document.getElementById('gameOverOverlay').style.display = 'flex';
        }

        window.quitMatch = function() {
            matchActive = false;
            cancelAnimationFrame(matchAnimationId);
            switchScreen('lobbyScreen');
        }

        window.returnToLobby = function() {
            document.getElementById('gameOverOverlay').style.display = 'none';
            switchScreen('lobbyScreen');
        }
    </script>
    <!-- ================= PARTE 3 (FINALE): PERSISTENZA DATI & INIZIALIZZAZIONE ================= -->
    <script>
        // Salvataggio automatico dei progressi del giocatore nel browser (LocalStorage)
        const SAVE_KEY = 'brawl_web_save_data';

        function saveGameProgress() {
            const saveData = {
                profile: playerProfile,
                brawlers: GAME_DATABASE.brawlers.map(b => ({ id: b.id, unlocked: b.unlocked, level: b.level }))
            };
            localStorage.setItem(SAVE_KEY, JSON.stringify(saveData));
        }

        function loadGameProgress() {
            const saved = localStorage.getItem(SAVE_KEY);
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    playerProfile = data.profile;
                    data.brawlers.forEach(sb => {
                        const b = GAME_DATABASE.brawlers.find(x => x.id === sb.id);
                        if (b) {
                            b.unlocked = sb.unlocked;
                            b.level = sb.level;
                        }
                    });
                } catch(e) {
                    console.error("Errore caricamento salvataggio:", e);
                }
            }
        }

        // Sovrascriviamo le funzioni di acquisto/sblocco per salvare automaticamente
        const originalSelectBrawler = window.selectBrawler;
        window.selectBrawler = function(id) {
            originalSelectBrawler(id);
            saveGameProgress();
        };

        const originalBuyShopItem = window.buyShopItem;
        window.buyShopItem = function(id) {
            originalBuyShopItem(id);
            saveGameProgress();
        };

        const originalSelectMap = window.selectMap;
        window.selectMap = function(id) {
            originalSelectMap(id);
            saveGameProgress();
        };

        // Carica i dati salvati all'avvio
        loadGameProgress();
        updateLobbyDisplay();
        populateBrawlerScreen();
        populateShopScreen();
        populateMapScreen();
    </script>
