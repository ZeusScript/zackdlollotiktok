<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme Studio - Crea e Scarica Meme</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --border: #334155;
            --accent: #8b5cf6;
            --accent-hover: #7c3aed;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Impact', 'Arial Black', sans-serif; }
        
        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 2.5rem;
            color: #f43f5e;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media(min-width: 800px) {
            .grid { grid-template-columns: 350px 1fr; }
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            height: fit-content;
        }

        .card h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #fff;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 5px;
            color: var(--text-muted);
            font-weight: 600;
        }

        input[type="text"], select, input[type="file"] {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: white;
            font-size: 0.9rem;
            font-family: sans-serif;
        }

        .controls-row {
            display: flex;
            gap: 10px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            font-family: sans-serif;
        }

        .btn-download {
            background: #10b981;
            color: #000;
            margin-top: 15px;
        }

        .btn-download:hover {
            background: #059669;
            color: #fff;
        }

        /* Area Canvas e Anteprima */
        .preview-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .canvas-container {
            width: 100%;
            max-width: 600px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        canvas {
            max-width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <header>
        <h1>🔥 MEME GENERATOR & DOWNLOADER</h1>
        <p>Scegli un template o carica una foto, aggiungi il testo e scarica il tuo meme gratis</p>
    </header>

    <div class="grid">
        <!-- PANNELLO CONTROLLI -->
        <div class="card">
            <h2>⚙️ Personalizza Meme</h2>

            <div class="form-group">
                <label>1. Scegli un Template Famoso</label>
                <select id="templateSelect" onchange="loadSelectedTemplate()">
                    <option value="">Caricamento template in corso...</option>
                </select>
            </div>

            <div class="form-group">
                <label>...oppure Carica la tua foto</label>
                <input type="file" id="imageInput" accept="image/*" onchange="handleImageUpload(event)">
            </div>

            <hr style="border: 0; border-top: 1px solid var(--border); margin: 15px 0;">

            <div class="form-group">
                <label>Testo Superiore (In Alto)</label>
                <input type="text" id="topText" placeholder="QUANDO IL PROFESSORE..." oninput="drawMeme()">
            </div>

            <div class="form-group">
                <label>Testo Inferiore (In Basso)</label>
                <input type="text" id="bottomText" placeholder="MA TU HAI GIÀ STUDIATO" oninput="drawMeme()">
            </div>

            <div class="controls-row">
                <div class="form-group" style="flex:1;">
                    <label>Dimensione Testo</label>
                    <input type="number" id="fontSize" value="40" min="20" max="80" oninput="drawMeme()">
                </div>
                <div class="form-group" style="flex:1;">
                    <label>Colore Testo</label>
                    <input type="color" id="textColor" value="#ffffff" onchange="drawMeme()" style="height: 40px; padding: 2px; width: 100%;">
                </div>
            </div>

            <button class="btn btn-download" onclick="downloadMeme()">📥 SCARICA MEME (PNG)</button>
        </div>

        <!-- ANTEPRIMA MEME -->
        <div class="card preview-area">
            <h2>🖼️ Anteprima in tempo reale</h2>
            <div class="canvas-container">
                <canvas id="memeCanvas"></canvas>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('memeCanvas');
        const ctx = canvas.getContext('2d');
        let currentImage = new Image();
        currentImage.crossOrigin = "anonymous";

        // Carica i 100 template di meme più famosi via API
        async function fetchTemplates() {
            try {
                const response = await fetch('https://api.imgflip.com/get_memes');
                const data = await response.json();
                const memes = data.data.memes;

                const select = document.getElementById('templateSelect');
                select.innerHTML = '';
                
                memes.forEach((meme, index) => {
                    const option = document.createElement('option');
                    option.value = meme.url;
                    option.textContent = meme.name;
                    select.appendChild(option);
                });

                // Carica il primo meme di default
                if(memes.length > 0) {
                    loadImgFromUrl(memes[0].url);
                }
            } catch (error) {
                console.error("Errore nel caricamento dei template:", error);
            }
        }

        function loadSelectedTemplate() {
            const url = document.getElementById('templateSelect').value;
            if (url) loadImgFromUrl(url);
        }

        function loadImgFromUrl(url) {
            currentImage = new Image();
            currentImage.crossOrigin = "anonymous";
            currentImage.src = url;
            currentImage.onload = () => {
                drawMeme();
            };
        }

        function handleImageUpload(e) {
            const reader = new FileReader();
            reader.onload = function(event) {
                currentImage = new Image();
                currentImage.src = event.target.result;
                currentImage.onload = () => {
                    drawMeme();
                }
            }
            if(e.target.files[0]) {
                reader.readAsDataURL(e.target.files[0]);
            }
        }

        function drawMeme() {
            if (!currentImage.complete || currentImage.width === 0) return;

            // Imposta dimensioni del canvas pari all'immagine
            canvas.width = currentImage.width;
            canvas.height = currentImage.height;

            // Disegna Immagine
            ctx.drawImage(currentImage, 0, 0);

            // Lettura input testo
            const topText = document.getElementById('topText').value.toUpperCase();
            const bottomText = document.getElementById('bottomText').value.toUpperCase();
            const fontSize = parseInt(document.getElementById('fontSize').value) || 40;
            const textColor = document.getElementById('textColor').value;

            // Configurazione Stile Testo Meme (stile Impact classico)
            ctx.fillStyle = textColor;
            ctx.strokeStyle = 'black';
            ctx.lineWidth = Math.max(3, fontSize / 8);
            ctx.textAlign = 'center';
            ctx.font = `900 ${fontSize}px Impact, 'Arial Black', sans-serif`;

            // Disegna Testo In Alto
            if (topText) {
                ctx.textBaseline = 'top';
                ctx.strokeText(topText, canvas.width / 2, 15);
                ctx.fillText(topText, canvas.width / 2, 15);
            }

            // Disegna Testo In Basso
            if (bottomText) {
                ctx.textBaseline = 'bottom';
                ctx.strokeText(bottomText, canvas.width / 2, canvas.height - 15);
                ctx.fillText(bottomText, canvas.width / 2, canvas.height - 15);
            }
        }

        function downloadMeme() {
            const link = document.createElement('a');
            link.download = 'mio-meme.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // Inizializza
        fetchTemplates();
    </script>
</body>
</html>
