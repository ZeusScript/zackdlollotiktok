<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brawl Stars HTML5</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

    <!-- LOBBY SCREEN -->
    <div id="lobby-screen" class="screen active">
        <div class="header">
            <div class="title">BRAWL HTML</div>
            <button class="btn btn-blue" style="width:auto; padding:6px 12px;" onclick="toggleFullScreen()">Fullscreen</button>
        </div>

        <div class="brawler-preview">
            <div id="lobby-brawler-img" class="brawler-avatar"></div>
            <div id="lobby-brawler-name" class="brawler-name">SHELBY</div>
            <div id="lobby-rarity-tag" class="rarity-tag">Comune</div>
        </div>

        <div class="menu-buttons">
            <button class="btn btn-blue" onclick="openModal('brawlers-modal')">Brawler</button>
            <button class="btn btn-purple" onclick="openModal('skins-modal')">Skin</button>
            <button class="btn btn-yellow" onclick="startGameIntro()">GIOCA</button>
        </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen" class="screen">
        <canvas id="gameCanvas"></canvas>

        <div class="hud">
            <div class="gem-counter">💎 Blu: <span id="blue-gems">0</span> | Rosse: <span id="red-gems">0</span></div>
            <div class="timer" id="match-timer">01:00</div>
        </div>

        <button class="btn-exit" onclick="exitGame()">ESCI</button>

        <div class="controls-layer">
            <div id="joystick-move" class="joystick-container">
                <div id="knob-move" class="joystick-knob"></div>
            </div>

            <div class="action-buttons">
                <div id="joystick-aim" class="joystick-container" style="width:80px; height:80px;">
                    <div id="knob-aim" class="joystick-knob" style="width:35px; height:35px; background:#FF2A2A;"></div>
                </div>
                <button id="btn-super" class="btn-action btn-super">SUPER</button>
            </div>
        </div>

        <!-- SCHERMATA VS -->
        <div id="vs-overlay">
            <div class="vs-card">
                <div id="vs-p1-img" style="width:120px; height:120px;"></div>
                <h2 id="vs-p1-name">TU</h2>
            </div>
            <div class="vs-title">VS</div>
            <div class="vs-card">
                <div id="vs-p2-img" style="width:120px; height:120px;"></div>
                <h2 id="vs-p2-name">NEMICO</h2>
            </div>
        </div>

        <!-- COUNTDOWN -->
        <div id="countdown-overlay">3</div>
    </div>

    <!-- SELEZIONE BRAWLER MODAL -->
    <div id="brawlers-modal" class="modal">
        <div class="modal-content">
            <h3>Scegli Brawler</h3>
            <div id="brawlers-list" style="margin-top:15px;"></div>
            <button class="btn btn-blue" onclick="closeModal('brawlers-modal')" style="width:100%; margin-top:10px;">Chiudi</button>
        </div>
    </div>

    <!-- SELEZIONE SKIN MODAL -->
    <div id="skins-modal" class="modal">
        <div class="modal-content">
            <h3>Scegli Skin</h3>
            <div id="skins-list" style="margin-top:15px;"></div>
            <button class="btn btn-purple" onclick="closeModal('skins-modal')" style="width:100%; margin-top:10px;">Chiudi</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
