<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brawl Stars HTML5 - Full Game</title>
    <!-- PeerJS per Multiplayer Peer-to-Peer -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0b0e14;
            color: #fff;
            font-family: 'Montserrat', 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
        }

        /* SCHERMATE DI GIOCO */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, #101625 0%, #1e2942 100%);
            z-index: 10;
        }
        .screen.active {
            display: flex;
        }

        /* HEADER & TOP BAR */
        .top-bar {
            width: 100%;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 2px solid #ffca28;
            z-index: 12;
        }
        .profile-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.1);
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .profile-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #ff9800;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 0 8px rgba(255, 152, 0, 0.8);
        }
        .currencies {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .currency-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: bold;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.5);
            padding: 4px 10px;
            border-radius: 12px;
            border: 1px solid #444;
        }
        .coin-icon { color: #ffd700; }
        .gem-icon { color: #00e676; }
        .trophy-icon { color: #ff9100; }

        /* PULSANTE FULLSCREEN */
        .fullscreen-btn {
            background: #29b6f6;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 0 #0288d1;
        }
        .fullscreen-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #0288d1;
        }

        /* LOBBY CONTENT */
        .lobby-main {
            display: flex;
            width: 100%;
            height: 100%;
            position: relative;
            justify-content: center;
            align-items: center;
        }
        .brawler-preview {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }
        .brawler-display {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 4px solid #fff;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: transform 0.3s ease;
        }
        .brawler-display:hover {
            transform: scale(1.05);
        }
        .brawler-name {
            font-size: 24px;
            font-weight: 900;
            margin-top: 10px;
            text-transform: uppercase;
            text-shadow: 0 3px 6px rgba(0,0,0,0.8);
            letter-spacing: 1px;
        }
        .brawler-skin-tag {
            font-size: 12px;
            color: #29b6f6;
            font-weight: bold;
            margin-top: 2px;
            background: rgba(0,0,0,0.6);
            padding: 2px 8px;
            border-radius: 10px;
        }

        /* BOTTOM NAVBAR LOBBY */
        .bottom-nav {
            width: 100%;
            padding: 10px 15px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: rgba(0, 0, 0, 0.85);
            border-top: 2px solid #333;
            z-index: 12;
        }
        .nav-btn {
            background: linear-gradient(180deg, #37474f 0%, #212121 100%);
            border: 2px solid #546e7a;
            color: #fff;
            padding: 8px 14px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            min-width: 65px;
            box-shadow: 0 4px 0 #101010;
        }
        .nav-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #101010;
        }
        .play-btn {
            background: linear-gradient(180deg, #ff9800 0%, #e65100 100%);
            border: 2px solid #ffe082;
            padding: 10px 24px;
            font-size: 18px;
            border-radius: 16px;
            box-shadow: 0 5px 0 #b23c00;
            animation: pulse 1.5s infinite alternate;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.04); }
        }

        /* MODALI / POPUP MENU */
        .modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 420px;
            max-height: 85%;
            background: #182232;
            border: 3px solid #ffca28;
            border-radius: 20px;
            padding: 20px;
            display: none;
            flex-direction: column;
            z-index: 20;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
            overflow-y: auto;
        }
        .modal.active { display: flex; }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #334155;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .modal-title { font-size: 20px; font-weight: 900; color: #ffca28; text-transform: uppercase; }
        .close-btn {
            background: #e53935;
            color: #fff;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
        }

        /* ELEMENTI MODALI */
        .grid-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .card-item {
            background: #233148;
            border: 2px solid #3b4d6b;
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .card-item.selected {
            border-color: #00e676;
            background: #1e3a34;
        }
        .card-img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        /* CANVAS DI GIOCO */
        #game-screen {
            position: relative;
            width: 100%;
            height: 100%;
        }
        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
            background-color: #2e7d32;
        }

        /* HUD DI GIOCO (JOYSTICK E SCONTRO) */
        .game-hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
        }
        .game-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: auto;
        }
        .health-bar-container {
            width: 140px;
            height: 16px;
            background: #000;
            border: 2px solid #fff;
            border-radius: 10px;
            overflow: hidden;
        }
        .health-bar-fill {
            width: 100%;
            height: 100%;
            background: #00e676;
            transition: width 0.2s;
        }

        /* CONTROLLI TOUCH */
        .touch-controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: auto;
        }
        .joystick-zone {
            width: 110px;
            height: 110px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            position: relative;
            touch-action: none;
        }
        .joystick-knob {
            width: 45px;
            height: 45px;
            background: #ffca28;
            border-radius: 50%;
            position: absolute;
            top: 32px;
            left: 32px;
            box-shadow: 0 0 10px rgba(255, 202, 40, 0.8);
            pointer-events: none;
        }
        .action-buttons {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .attack-btn {
            width: 65px;
            height: 65px;
            background: linear-gradient(180deg, #ff5252 0%, #b71c1c 100%);
            border: 3px solid #ff8a80;
            border-radius: 50%;
            color: #fff;
            font-weight: 900;
            font-size: 14px;
            box-shadow: 0 4px 0 #5f0909;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .super-btn {
            width: 55px;
            height: 55px;
            background: linear-gradient(180deg, #ab47bc 0%, #4a148c 100%);
            border: 3px solid #e1bee7;
            border-radius: 50%;
            color: #fff;
            font-weight: 900;
            font-size: 11px;
            box-shadow: 0 4px 0 #20003b;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .attack-btn:active, .super-btn:active {
            transform: scale(0.92);
        }

        /* CHAT BOX */
        .chat-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            height: 200px;
        }
        .chat-messages {
            flex: 1;
            background: #101722;
            border-radius: 8px;
            padding: 10px;
            overflow-y: auto;
            font-size: 12px;
        }
        .chat-input-group {
            display: flex;
            gap: 5px;
        }
        .chat-input {
            flex: 1;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- LOBBY PRINCIPALE -->
    <div id="lobby-screen" class="screen active">
        <!-- TOP BAR -->
        <div class="top-bar">
            <div class="profile-badge">
                <div class="profile-avatar" id="user-avatar">S</div>
                <div>
                    <div style="font-weight: 900; font-size: 13px;" id="user-name">ProGamer</div>
                    <div style="font-size: 11px; color: #aaa;"><span class="trophy-icon">🏆</span> <span id="trophies-count">1250</span></div>
                </div>
            </div>
            <div class="currencies">
                <div class="currency-item"><span class="coin-icon">🪙</span> <span id="coins-count">850</span></div>
                <div class="currency-item"><span class="gem-icon">💎</span> <span id="gems-count">45</span></div>
                <button class="fullscreen-btn" onclick="toggleFullScreen()">📱 SCHERMO INTERO</button>
            </div>
        </div>

        <!-- ANTEPRIMA BRAWLER CENTRALE -->
        <div class="lobby-main">
            <div class="brawler-preview">
                <div class="brawler-display" id="lobby-brawler-img" style="background-color: #1e88e5;">
                    <span style="font-size: 40px;" id="lobby-brawler-icon">💥</span>
                </div>
                <div class="brawler-name" id="lobby-brawler-name">SHELBY</div>
                <div class="brawler-skin-tag" id="lobby-skin-name">Skin Predefinita</div>
            </div>
        </div>

        <!-- NAVBAR IN BASSO -->
        <div class="bottom-nav">
            <button class="nav-btn" onclick="openModal('brawlers-modal')">🎮<span>BRAWLERS</span></button>
            <button class="nav-btn" onclick="openModal('skins-modal')">🎨<span>SKIN</span></button>
            <button class="nav-btn play-btn" onclick="startGame()">⚔️ GIOCA</button>
            <button class="nav-btn" onclick="openModal('maps-modal')">🗺️<span>MAPPA</span></button>
            <button class="nav-btn" onclick="openModal('multiplayer-modal')">🌐<span>MULTIPLAYER</span></button>
        </div>
    </div>

    <!-- MODALE BRAWLERS -->
    <div id="brawlers-modal" class="modal">
        <div class="modal-header">
            <div class="modal-title">SELEZIONA BRAWLER</div>
            <button class="close-btn" onclick="closeModal('brawlers-modal')">X</button>
        </div>
        <div class="grid-list" id="brawlers-list"></div>
    </div>

    <!-- MODALE SKIN -->
    <div id="skins-modal" class="modal">
        <div class="modal-header">
            <div class="modal-title">SKIN DISPONIBILI</div>
            <button class="close-btn" onclick="closeModal('skins-modal')">X</button>
        </div>
        <div class="grid-list" id="skins-list"></div>
    </div>

    <!-- MODALE MAPPE -->
    <div id="maps-modal" class="modal">
        <div class="modal-header">
            <div class="modal-title">SELEZIONA MAPPA</div>
            <button class="close-btn" onclick="closeModal('maps-modal')">X</button>
        </div>
        <div class="grid-list" id="maps-list"></div>
    </div>

    <!-- MODALE MULTIPLAYER & CHAT -->
    <div id="multiplayer-modal" class="modal">
        <div class="modal-header">
            <div class="modal-title">STANZA & CLUB CHAT</div>
            <button class="close-btn" onclick="closeModal('multiplayer-modal')">X</button>
        </div>
        <div style="margin-bottom: 15px;">
            <div style="font-size: 12px; color: #aaa; margin-bottom: 5px;">IL TUO CODICE STANZA (PEERJS):</div>
            <input type="text" id="my-peer-id" readonly class="chat-input" value="Generazione codice..." style="width: 100%; text-align: center; font-weight: bold; color: #ffca28;">
        </div>
        <div style="margin-bottom: 15px; display: flex; gap: 5px;">
            <input type="text" id="join-peer-id" class="chat-input" placeholder="Inserisci Codice Amico...">
            <button class="fullscreen-btn" onclick="connectToPeer()">CONNETTI</button>
        </div>
        <div style="font-size: 12px; font-weight: bold; margin-bottom: 5px; color: #29b6f6;">CHAT DEL CLUB</div>
        <div class="chat-container">
            <div class="chat-messages" id="chat-box">
                <div style="color: #666;">[Sistema]: Benvenuto nella Chat di Gruppo!</div>
            </div>
            <div class="chat-input-group">
                <input type="text" id="chat-msg" class="chat-input" placeholder="Scrivi un messaggio...">
                <button class="fullscreen-btn" onclick="sendChatMessage()">INVIA</button>
            </div>
        </div>
    </div>

    <!-- SCHERMATA DI GIOCO -->
    <div id="game-screen" class="screen">
        <canvas id="gameCanvas"></canvas>
        <div class="game-hud">
            <div class="game-top-bar">
                <div class="health-bar-container">
                    <div class="health-bar-fill" id="player-hp-bar"></div>
                </div>
                <button class="fullscreen-btn" style="background: #e53935;" onclick="exitGame()">ESCI</button>
            </div>
            <div class="touch-controls">
                <div class="joystick-zone" id="joystick-zone">
                    <div class="joystick-knob" id="joystick-knob"></div>
                </div>
                <div class="action-buttons">
                    <button class="super-btn" onclick="triggerSuper()">SUPER</button>
                    <button class="attack-btn" onclick="triggerAttack()">SPARA</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        /* === DATI DI GIOCO === */
        const BRAWLERS = [
            { id: 'shelby', name: 'SHELBY', color: '#1e88e5', icon: '💥', hp: 1000, speed: 3.5, desc: 'Sparatutto Bilanciato' },
            { id: 'bull', name: 'BULL', color: '#e53935', icon: '🐂', hp: 1600, speed: 2.8, desc: 'Tank a Corto Raggio' },
            { id: 'crow', name: 'CROW', color: '#8e24aa', icon: '🦅', hp: 700, speed: 4.2, desc: 'Veloce e Velenoso' }
        ];

        const SKINS = [
            { id: 'default', name: 'Predefinita', color: null },
            { id: 'gold', name: 'Oro Puro', color: '#ffd700' },
            { id: 'mecha', name: 'Mecha Robot', color: '#00e5ff' }
        ];

        const MAPS = [
            { id: 'gem_grab', name: 'Arraffagemme', bg: '#2e7d32', border: '#1b5e20' },
            { id: 'brawl_ball', name: 'Brawl Ball', bg: '#1565c0', border: '#0d47a1' },
            { id: 'desert', name: 'Scontro Deserto', bg: '#d84315', border: '#bf360c' }
        ];

        // Stato Selezionato
        let currentBrawler = BRAWLERS[0];
        let currentSkin = SKINS[0];
        let currentMap = MAPS[0];

        /* === GESTIONE MODALI & LOBBY === */
        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        function renderSelectionLists() {
            // Lista Brawlers
            const bContainer = document.getElementById('brawlers-list');
            bContainer.innerHTML = '';
            BRAWLERS.forEach(b => {
                const item = document.createElement('div');
                item.className = `card-item ${currentBrawler.id === b.id ? 'selected' : ''}`;
                item.onclick = () => { currentBrawler = b; updateLobbyDisplay(); renderSelectionLists(); closeModal('brawlers-modal'); };
                item.innerHTML = `<div class="card-img" style="background:${b.color}">${b.icon}</div>
                                  <div style="font-weight:bold; font-size:13px;">${b.name}</div>
                                  <div style="font-size:10px; color:#aaa;">${b.desc}</div>`;
                bContainer.appendChild(item);
            });

            // Lista Skin
            const sContainer = document.getElementById('skins-list');
            sContainer.innerHTML = '';
            SKINS.forEach(s => {
                const item = document.createElement('div');
                item.className = `card-item ${currentSkin.id === s.id ? 'selected' : ''}`;
                item.onclick = () => { currentSkin = s; updateLobbyDisplay(); renderSelectionLists(); closeModal('skins-modal'); };
                const color = s.color || currentBrawler.color;
                item.innerHTML = `<div class="card-img" style="background:${color}">${currentBrawler.icon}</div>
                                  <div style="font-weight:bold; font-size:13px;">${s.name}</div>`;
                sContainer.appendChild(item);
            });

            // Lista Mappe
            const mContainer = document.getElementById('maps-list');
            mContainer.innerHTML = '';
            MAPS.forEach(m => {
                const item = document.createElement('div');
                item.className = `card-item ${currentMap.id === m.id ? 'selected' : ''}`;
                item.onclick = () => { currentMap = m; renderSelectionLists(); closeModal('maps-modal'); };
                item.innerHTML = `<div class="card-img" style="background:${m.bg}">🗺️</div>
                                  <div style="font-weight:bold; font-size:13px;">${m.name}</div>`;
                mContainer.appendChild(item);
            });
        }

        function updateLobbyDisplay() {
            document.getElementById('lobby-brawler-name').innerText = currentBrawler.name;
            document.getElementById('lobby-skin-name').innerText = currentSkin.name;
            document.getElementById('lobby-brawler-icon').innerText = currentBrawler.icon;
            document.getElementById('lobby-brawler-img').style.backgroundColor = currentSkin.color || currentBrawler.color;
        }

        /* === SCHERMO INTERO (FULLSCREEN) === */
        function toggleFullScreen() {
            let doc = window.document;
            let docEl = doc.documentElement;
            let requestFullScreen = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
            let cancelFullScreen = doc.exitFullscreen || doc.mozCancelFullScreen || doc.webkitExitFullscreen || doc.msExitFullscreen;

            if(!doc.fullscreenElement && !doc.mozFullScreenElement && !doc.webkitFullscreenElement && !doc.msFullscreenElement) {
                requestFullScreen.call(docEl);
            } else {
                cancelFullScreen.call(doc);
            }
        }

        /* === MOTORE DI GIOCO CANVAS === */
        let canvas, ctx;
        let gameRunning = false;
        let player = { x: 0, y: 0, radius: 18, hp: 1000, maxHp: 1000, vx: 0, vy: 0, angle: 0 };
        let enemy = { x: 200, y: 150, radius: 20, hp: 800, maxHp: 800 };
        let bullets = [];

        function startGame() {
            document.getElementById('lobby-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');

            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            // Inizializza Giocatore
            player.x = canvas.width / 2;
            player.y = canvas.height / 2 + 100;
            player.hp = currentBrawler.hp;
            player.maxHp = currentBrawler.hp;

            gameRunning = true;
            initJoystick();
            requestAnimationFrame(gameLoop);
        }

        function exitGame() {
            gameRunning = false;
            document.getElementById('game-screen').classList.remove('active');
            document.getElementById('lobby-screen').classList.add('active');
        }

        function triggerAttack() {
            if(!gameRunning) return;
            // Spara proiettile nella direzione dell'angolo attuale
            bullets.push({
                x: player.x,
                y: player.y,
                vx: Math.cos(player.angle) * 9,
                vy: Math.sin(player.angle) * 9,
                radius: 6
            });
        }

        function triggerSuper() {
            if(!gameRunning) return;
            // Super mossa: Spara 5 proiettili a ventaglio
            for(let i = -2; i <= 2; i++) {
                let a = player.angle + (i * 0.2);
                bullets.push({
                    x: player.x,
                    y: player.y,
                    vx: Math.cos(a) * 12,
                    vy: Math.sin(a) * 12,
                    radius: 9,
                    isSuper: true
                });
            }
        }

        function updateGameLogic() {
            // Movimento Giocatore
            player.x += player.vx;
            player.y += player.vy;

            // Limiti Mappa
            player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
            player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

            // Aggiorna Proiettili
            for(let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += b.vx;
                b.y += b.vy;

                // Collisione Nemico
                let dx = b.x - enemy.x;
                let dy = b.y - enemy.y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                if(dist < b.radius + enemy.radius) {
                    enemy.hp -= b.isSuper ? 250 : 100;
                    if(enemy.hp <= 0) enemy.hp = enemy.maxHp;
                    bullets.splice(i, 1);
                    continue;
                }

                // Rimuovi fuori schermo
                if(b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
                    bullets.splice(i, 1);
                }
            }

            // Aggiorna HUD
            document.getElementById('player-hp-bar').style.width = `${(player.hp / player.maxHp) * 100}%`;
        }

        function drawGame() {
            // Disegna Sfondo Mappa Selezionata
            ctx.fillStyle = currentMap.bg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Bordo Mappa
            ctx.strokeStyle = currentMap.border;
            ctx.lineWidth = 10;
            ctx.strokeRect(0, 0, canvas.width, canvas.height);

            // Disegna Nemico (Bot/Avversario)
            ctx.beginPath();
            ctx.arc(enemy.x, enemy.y, enemy.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#e53935';
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#fff';
            ctx.stroke();

            // Barra HP Nemico
            ctx.fillStyle = '#000';
            ctx.fillRect(enemy.x - 20, enemy.y - 32, 40, 6);
            ctx.fillStyle = '#00e676';
            ctx.fillRect(enemy.x - 20, enemy.y - 32, (enemy.hp / enemy.maxHp) * 40, 6);

            // Disegna Giocatore (Con Skin)
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fillStyle = currentSkin.color || currentBrawler.color;
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#fff';
            ctx.stroke();

            // Indicatore Direzione Sguardo
            ctx.beginPath();
            ctx.moveTo(player.x, player.y);
            ctx.lineTo(player.x + Math.cos(player.angle) * 28, player.y + Math.sin(player.angle) * 28);
            ctx.strokeStyle = '#ffca28';
            ctx.lineWidth = 4;
            ctx.stroke();

            // Disegna Proiettili
            bullets.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fillStyle = b.isSuper ? '#ab47bc' : '#ffca28';
                ctx.fill();
            });
        }

        function gameLoop() {
            if(!gameRunning) return;
            updateGameLogic();
            drawGame();
            requestAnimationFrame(gameLoop);
        }

        /* === JOYSTICK TOUCH CONTROL === */
        function initJoystick() {
            const zone = document.getElementById('joystick-zone');
            const knob = document.getElementById('joystick-knob');
            let active = false;
            let startX, startY;

            zone.addEventListener('touchstart', e => {
                active = true;
                let rect = zone.getBoundingClientRect();
                startX = rect.left + rect.width / 2;
                startY = rect.top + rect.height / 2;
            });

            window.addEventListener('touchmove', e => {
                if(!active) return;
                let touch = e.touches[0];
                let dx = touch.clientX - startX;
                let dy = touch.clientY - startY;
                let dist = Math.sqrt(dx*dx + dy*dy);
                let maxRadius = 35;

                if(dist > maxRadius) {
                    dx = (dx / dist) * maxRadius;
                    dy = (dy / dist) * maxRadius;
                }

                knob.style.transform = `translate(${dx}px, ${dy}px)`;

                // Imposta Velocità e Angolo del Giocatore
                player.vx = (dx / maxRadius) * currentBrawler.speed;
                player.vy = (dy / maxRadius) * currentBrawler.speed;
                if(dx !== 0 || dy !== 0) {
                    player.angle = Math.atan2(dy, dx);
                }
            });

            window.addEventListener('touchend', () => {
                active = false;
                knob.style.transform = `translate(0px, 0px)`;
                player.vx = 0;
                player.vy = 0;
            });
        }

        /* === PEERJS MULTIPLAYER & CHAT === */
        let peer = new Peer();
        let conn = null;

        peer.on('open', id => {
            document.getElementById('my-peer-id').value = id;
        });

        peer.on('connection', c => {
            conn = c;
            setupChatConnection();
        });

        function connectToPeer() {
            let remoteId = document.getElementById('join-peer-id').value;
            if(!remoteId) return;
            conn = peer.connect(remoteId);
            setupChatConnection();
        }

        function setupChatConnection() {
            conn.on('data', data => {
                if(data.type === 'chat') {
                    appendChatMessage("Amico", data.msg);
                }
            });
            appendChatMessage("Sistema", "Connesso con successo al giocatore!");
        }

        function sendChatMessage() {
            let msgInput = document.getElementById('chat-msg');
            let msg = msgInput.value;
            if(!msg) return;

            appendChatMessage("Tu", msg);
            if(conn) {
                conn.send({ type: 'chat', msg: msg });
            }
            msgInput.value = '';
        }

        function appendChatMessage(author, msg) {
            let box = document.getElementById('chat-box');
            let div = document.createElement('div');
            div.innerHTML = `<strong>${author}:</strong> ${msg}`;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        // Inizializzazione dati
        renderSelectionLists();
        updateLobbyDisplay();
    </script>
</body>
</html>
