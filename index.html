<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zackdis - Official Links & Support</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .profile-header {
      text-align: center;
      margin-bottom: 10px;
    }
    .profile-header h1 {
      font-size: 2em;
      color: #38bdf8;
      margin-bottom: 5px;
    }
    .profile-header p {
      color: #94a3b8;
      font-size: 0.95em;
    }
    
    /* Social Cards */
    .social-links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .social-btn {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 15px;
      padding: 14px 20px;
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .social-btn:hover {
      transform: translateY(-2px);
      border-color: #38bdf8;
      background-color: #334155;
    }
    .social-btn i {
      font-size: 1.4em;
      width: 25px;
      text-align: center;
    }
    .discord-btn i { color: #5865F2; }
    .tiktok-btn i { color: #ff0050; }
    .youtube-btn i { color: #ff0000; }
    .instagram-btn i { color: #E1306C; }

    /* Modulo Contatti Card */
    .contact-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 25px;
      margin-top: 10px;
    }
    .contact-card h2 {
      font-size: 1.3em;
      margin-bottom: 6px;
      color: #38bdf8;
    }
    .contact-card p {
      font-size: 0.85em;
      color: #94a3b8;
      margin-bottom: 18px;
    }
    .form-group {
      margin-bottom: 14px;
    }
    .form-group label {
      display: block;
      font-size: 0.8em;
      font-weight: 600;
      margin-bottom: 5px;
      color: #cbd5e1;
    }
    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #475569;
      background-color: #0f172a;
      color: #fff;
      font-size: 0.9em;
      outline: none;
    }
    .form-group input:focus,
    .form-group textarea:focus {
      border-color: #38bdf8;
    }
    .submit-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background-color: #5865f2;
      color: white;
      font-weight: bold;
      font-size: 0.95em;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .submit-btn:hover {
      background-color: #4752c4;
    }
    .submit-btn:disabled {
      background-color: #475569;
      cursor: not-allowed;
    }
    #form-status {
      margin-top: 12px;
      font-size: 0.85em;
      text-align: center;
      display: none;
      padding: 8px;
      border-radius: 6px;
    }
    .status-success {
      background-color: rgba(34, 197, 94, 0.1);
      color: #4ade80;
      border: 1px solid #22c55e;
    }
    .status-error {
      background-color: rgba(239, 68, 68, 0.1);
      color: #f87171;
      border: 1px solid #ef4444;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Header -->
    <div class="profile-header">
      <h1>Zackdis</h1>
      <p>Community & Official Links</p>
    </div>

    <!-- Pulsanti Social -->
    <div class="social-links">
      <a href="https://discord.gg/TuoLinkDiscord" target="_blank" class="social-btn discord-btn">
        <i class="fa-brands fa-discord"></i> Entra nel Server Discord
      </a>
      <a href="https://www.tiktok.com/@TuoProfilo" target="_blank" class="social-btn tiktok-btn">
        <i class="fa-brands fa-tiktok"></i> Segui su TikTok
      </a>
      <a href="https://www.youtube.com/@TuoCanale" target="_blank" class="social-btn youtube-btn">
        <i class="fa-brands fa-youtube"></i> Canale YouTube
      </a>
      <a href="https://www.instagram.com/TuoProfilo" target="_blank" class="social-btn instagram-btn">
        <i class="fa-brands fa-instagram"></i> Profilo Instagram
      </a>
    </div>

    <!-- Modulo Contatti Collegato a Make -->
    <div class="contact-card">
      <h2>📩 Invia un messaggio</h2>
      <p>Compila il modulo per contattarci direttamente su Discord.</p>

      <form id="zackdis-form">
        <div class="form-group">
          <label for="name">Nome / Nickname</label>
          <input type="text" id="name" required placeholder="Inserisci il tuo nome">
        </div>

        <div class="form-group">
          <label for="email">Indirizzo Email</label>
          <input type="email" id="email" required placeholder="tuamail@esempio.com">
        </div>

        <div class="form-group">
          <label for="subject">Oggetto</label>
          <input type="text" id="subject" required placeholder="Motivo del contatto">
        </div>

        <div class="form-group">
          <label for="message">Messaggio</label>
          <textarea id="message" rows="3" required placeholder="Scrivi il tuo messaggio..."></textarea>
        </div>

        <button type="submit" id="submit-btn" class="submit-btn">Invia Messaggio</button>
        <div id="form-status"></div>
      </form>
    </div>

  </div>

  <script>
    document.getElementById('zackdis-form').addEventListener('submit', async function(e) {
      e.preventDefault();

      const btn = document.getElementById('submit-btn');
      const status = document.getElementById('form-status');

      btn.disabled = true;
      btn.innerText = 'Invio in corso...';
      status.style.display = 'none';

      const payload = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        subject: document.getElementById('subject').value,
        message: document.getElementById('message').value
      };

      try {
        const response = await fetch('https://hook.eu1.make.com/ok6vt2okfl5u7rxe399tx06yzpc83qv6', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          status.className = 'status-success';
          status.innerText = '✅ Messaggio inviato con successo!';
          status.style.display = 'block';
          document.getElementById('zackdis-form').reset();
        } else {
          throw new Error('Errore nella risposta del server');
        }
      } catch (err) {
        status.className = 'status-error';
        status.innerText = '❌ Si è verificato un errore. Riprova più tardi.';
        status.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.innerText = 'Invia Messaggio';
      }
    });
  </script>

</body>
</html>
