<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mini Brawl Stars 2D</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            overflow: hidden;
            touch-action: none;
        }
        h2 { margin: 5px 0; font-size: 18px; }
        #canvas-container {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            background-color: #4CAF50; /* Erba della mappa */
            border: 3px solid #2E7D32;
            border-radius: 8px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.5);
        }
        .controls-info {
            font-size: 12px;
            color: #ccc;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <h2>Mini Brawl - Test Prototipo</h2>
    <div id="canvas-container">
        <canvas id="gameCanvas" width="340" height="480"></canvas>
    </div>
    <div class="controls-info">Tocca lo schermo per muovere il Brawler e sparare al bersaglio rossogallo</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Brawler del giocatore
        let brawler = {
            x: 170,
            y: 380,
            radius: 15,
            color: "#1E88E5", // Blu
            speed: 4
        };

        // Bersaglio/Nemico
        let target = {
            x: 170,
            y: 80,
            radius: 20,
            color: "#E53935", // Rosso
            hp: 100
        };

        // Lista dei proiettili attivi
        let bullets = [];

        // Gestione del tocco su smartphone
        canvas.addEventListener("touchstart", function(e) {
            let rect = canvas.getBoundingClientRect();
            let touchX = e.touches[0].clientX - rect.left;
            let touchY = e.touches[0].clientY - rect.top;

            // Sposta il personaggio verso il punto toccato
            brawler.x = touchX;

            // Spara un proiettile dal Brawler verso l'alto
            bullets.push({
                x: brawler.x,
                y: brawler.y - brawler.radius,
                speed: 8,
                radius: 5
            });
        });

        // Loop di aggiornamento del gioco
        function update() {
            // Aggiorna la posizione dei proiettili
            for (let i = 0; i < bullets.length; i++) {
                bullets[i].y -= bullets[i].speed;

                // Controllo collisione con il bersaglio
                let dx = bullets[i].x - target.x;
                let dy = bullets[i].y - target.y;
                let distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < bullets[i].radius + target.radius) {
                    target.hp -= 10;
                    if (target.hp <= 0) target.hp = 100; // Resetta vita se distrutto
                    bullets.splice(i, 1);
                    i--;
                    continue;
                }

                // Rimuovi proiettili fuori dallo schermo
                if (bullets[i] && bullets[i].y < 0) {
                    bullets.splice(i, 1);
                    i--;
                }
            }
        }

        // Render della grafica
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Disegna il Brawler
            ctx.beginPath();
            ctx.arc(brawler.x, brawler.y, brawler.radius, 0, Math.PI * 2);
            ctx.fillStyle = brawler.color;
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = "#ffffff";
            ctx.stroke();
            ctx.closePath();

            // Disegna il Nemico
            ctx.beginPath();
            ctx.arc(target.x, target.y, target.radius, 0, Math.PI * 2);
            ctx.fillStyle = target.color;
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = "#ffffff";
            ctx.stroke();
            ctx.closePath();

            // Barra della vita del nemico
            ctx.fillStyle = "black";
            ctx.fillRect(target.x - 20, target.y - 30, 40, 6);
            ctx.fillStyle = "#00FF00";
            ctx.fillRect(target.x - 20, target.y - 30, (target.hp / 100) * 40, 6);

            // Disegna i proiettili
            ctx.fillStyle = "#FFEB3B"; // Giallo
            for (let bullet of bullets) {
                ctx.beginPath();
                ctx.arc(bullet.x, bullet.y, bullet.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.closePath();
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
