<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brawl Stars HTML5 - Remastered</title>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --brawl-yellow: #FFCC00;
            --brawl-yellow-dark: #C79C00;
            --brawl-orange: #FF6600;
            --brawl-red: #FF2A2A;
            --brawl-purple: #A628F7;
            --brawl-blue: #0099FF;
            --brawl-green: #00E640;
            --brawl-dark-bg: #0C101C;
            --brawl-card-bg: linear-gradient(180deg, #232E42 0%, #151D2A 100%);
            --brawl-stroke: #000000;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            font-family: 'Lilita One', 'Montserrat', sans-serif;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--brawl-dark-bg);
            color: #fff;
            overflow: hidden;
        }

        /* --- BACKGROUND TEXTURE --- */
        .bg-pattern {
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 50% 30%, rgba(255, 204, 0, 0.15) 0%, transparent 70%),
                linear-gradient(135deg, #182234 0%, #080C14 100%);
            z-index: 1;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        .screen.active { display: flex; }

        /* --- HEADER & HUD --- */
        .top-bar {
            width: 100%;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 12;
            background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 100%);
        }

        .profile-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #151C28;
            padding: 6px 16px 6px 8px;
            border-radius: 40px;
            border: 3px solid #000;
            box-shadow: 0 4px 0 #000, inset 0 2px 0 rgba(255,255,255,0.2);
        }

        .profile-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(180deg, #FFCC00 0%, #FF6600 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            border: 2px solid #000;
            box-shadow: inset 0 2px 0 rgba(255,255,255,0.5);
        }

        .currencies {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .currency-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 16px;
            background: #151C28;
            padding: 6px 14px;
            border-radius: 20px;
            border: 3px solid #000;
            box-shadow: 0 4px 0 #000;
            text-shadow: 2px 2px 0 #000;
        }

        .btn-bs {
            background: linear-gradient(180deg, #00BFFF 0%, #0066CC 100%);
            color: #fff;
            border: 3px solid #000;
            padding: 8px 16px;
            border-radius: 14px;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 5px 0 #003366, inset 0 2px 0 rgba(255,255,255,0.4);
            text-shadow: 2px 2px 0 #000;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.05s ease;
        }
        .btn-bs:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #003366;
        }

        /* --- LOBBY MAIN --- */
        .lobby-main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 5;
            position: relative;
        }

        .brawler-display-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .brawler-pedestal {
            width: 180px;
            height: 40px;
            background: radial-gradient(ellipse at center, rgba(0,230,64,0.6) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            position: absolute;
            bottom: 30px;
            z-index: 1;
            transform: rotateX(60deg);
        }

        .brawler-display {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 6px solid #000;
            box-shadow: 0 8px 0 #000, 0 0 30px rgba(255, 204, 0, 0.4);
            z-index: 2;
            background-size: cover;
            background-position: center;
            background-color: #232E42;
            overflow: hidden;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
        }

        .brawler-name {
            font-size: 36px;
            margin-top: 15px;
            text-transform: uppercase;
            color: #FFF;
            text-shadow: 3px 3px 0 #000, -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000, 0 5px 0 #000;
            letter-spacing: 2px;
            z-index: 2;
        }

        .brawler-rarity-tag {
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            padding: 4px 16px;
            border-radius: 20px;
            border: 3px solid #000;
            box-shadow: 0 3px 0 #000;
            margin-top: 4px;
            z-index: 2;
            text-shadow: 1px 1px 0 #000;
        }

        /* --- NAVIGATION --- */
        .bottom-nav {
            width: 100%;
            padding: 16px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            background: linear-gradient(0deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
            z-index: 12;
        }

        .nav-btn {
            background: linear-gradient(180deg, #4F5D73 0%, #2D3748 100%);
            border: 3px solid #000;
            color: #fff;
            padding: 10px 16px;
            border-radius: 16px;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            min-width: 95px;
            box-shadow: 0 5px 0 #1A202C, inset 0 2px 0 rgba(255,255,255,0.3);
            text-shadow: 2px 2px 0 #000;
        }

        .play-btn {
            background: linear-gradient(180deg, #00E640 0%, #009926 100%);
            border: 4px solid #000;
            padding: 12px 36px;
            font-size: 28px;
            border-radius: 20px;
            box-shadow: 0 7px 0 #005916, inset 0 3px 0 rgba(255,255,255,0.5);
            animation: pulse 1.5s infinite alternate;
            color: #FFF;
            text-shadow: 3px 3px 0 #000;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        /* --- MODALS --- */
        .modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 580px;
            max-height: 85vh;
            background: #182234;
            border: 5px solid #000;
            border-radius: 24px;
            padding: 20px;
            display: none;
            flex-direction: column;
            z-index: 30;
            box-shadow: 0 10px 0 #000, 0 0 50px rgba(0,0,0,0.8);
            overflow-y: auto;
        }
        .modal.active { display: flex; }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid #0D131D;
            padding-bottom: 12px;
            margin-bottom: 16px;
        }

        .modal-title { 
            font-size: 24px; 
            color: var(--brawl-yellow); 
            text-shadow: 2px 2px 0 #000;
            text-transform: uppercase;
        }

        .close-btn {
            background: linear-gradient(180deg, #FF2A2A 0%, #990000 100%);
            color: #fff;
            border: 3px solid #000;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 4px 0 #590000;
        }

        .grid-list {
            display: grid;
            grid-template-columns: repeat(1, 1fr);
            gap: 12px;
        }

        .card-item {
            background: linear-gradient(180deg, #2A384E 0%, #1A2434 100%);
            border: 3px solid #000;
            border-radius: 16px;
            padding: 12px;
            display: flex;
            gap: 14px;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 0 #000;
            transition: transform 0.1s;
        }
        .card-item:hover { transform: scale(1.02); }

        .card-item.selected {
            border-color: var(--brawl-yellow);
            background: linear-gradient(180deg, #3A4D6A 0%, #253347 100%);
            box-shadow: 0 4px 0 var(--brawl-yellow-dark);
        }

        .card-img-box {
            width: 64px;
            height: 64px;
            border-radius: 14px;
            border: 3px solid #000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background: #0D131D;
            overflow: hidden;
        }

        .card-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .card-title {
            font-size: 18px;
            color: #fff;
            text-shadow: 1px 1px 0 #000;
        }

        .card-stats {
            display: flex;
            gap: 6px;
            font-size: 11px;
            color: #CBD5E1;
            flex-wrap: wrap;
        }

        .stat-badge {
            background: #0D131D;
            padding: 3px 8px;
            border-radius: 8px;
            border: 1px solid #334155;
        }

        /* --- GAME ENGINE UI --- */
        #game-screen {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
        }

        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .game-hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
        }

        .touch-controls {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            padding: 0 40px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: auto;
        }

        .joystick-zone {
            width: 130px;
            height: 130px;
            background: rgba(0, 0, 0, 0.3);
            border: 4px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            position: relative;
            touch-action: none;
        }

        .joystick-knob {
            width: 55px;
            height: 55px;
            background: radial-gradient(circle, #FFCC00 0%, #FF6600 100%);
            border: 3px solid #000;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            box-shadow: 0 4px 0 #000;
        }

        .action-buttons {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .attack-btn {
            width: 80px;
            height: 80px;
            background: linear-gradient(180deg, #FF2A2A 0%, #B30000 100%);
            border: 4px solid #000;
            border-radius: 50%;
            color: #fff;
            font-size: 15px;
            box-shadow: 0 6px 0 #590000;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 2px 2px 0 #000;
        }

        .super-btn {
            width: 70px;
            height: 70px;
            background: linear-gradient(180deg, #A628F7 0%, #6A00B3 100%);
            border: 4px solid #000;
            border-radius: 50%;
            color: #fff;
            font-size: 13px;
            box-shadow: 0 6px 0 #3B0066;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 2px 2px 0 #000;
        }

        .chat-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            height: 180px;
        }

        .chat-messages {
            flex: 1;
            background: #0D131D;
            border-radius: 12px;
            padding: 10px;
            overflow-y: auto;
            font-size: 13px;
            border: 2px solid #2A384E;
            font-family: 'Montserrat', sans-serif;
        }

        .chat-input-group {
            display: flex;
            gap: 8px;
        }

        .chat-input {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            border: 2px solid #2A384E;
            background: #0D131D;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
        }
    </style>
</head>
<body>

    <div class="bg-pattern"></div>

    <!-- LOBBY SCREEN -->
    <div id="lobby-screen" class="screen active">
        <div class="top-bar">
            <div class="profile-badge">
                <div class="profile-avatar">🏆</div>
                <div>
                    <div style="font-size: 14px;" id="user-name">ProGamer</div>
                    <div style="font-size: 12px; color: var(--brawl-yellow); display: flex; align-items: center; gap: 4px;">
                        <span>🏆</span> <span id="trophies-count">1250</span>
                    </div>
                </div>
            </div>
            <div class="currencies">
                <div class="currency-item">
                    <span style="color:#FFCC00">🪙</span>
                    <span id="coins-count">850</span>
                </div>
                <div class="currency-item">
                    <span style="color:#00E640">💎</span>
                    <span id="gems-count">45</span>
                </div>
                <button class="btn-bs" onclick="toggleFullScreen()">FULLSCREEN</button>
            </div>
        </div>

        <div class="lobby-main">
            <div class="brawler-display-container">
                <div class="brawler-pedestal"></div>
                <div class="brawler-display" id="lobby-brawler-img"></div>
                <div class="brawler-name" id="lobby-brawler-name">SHELBY</div>
                <div class="brawler-rarity-tag" id="lobby-rarity-tag">Comune</div>
            </div>
        </div>

        <div class="bottom-nav">
            <button class="nav-btn" onclick="openModal('brawlers-modal')">
                <span style="font-size:20px;">⚔️</span>
                <span>BRAWLERS</span>
            </button>
            <button class="nav-btn" onclick="openModal('skins-modal')">
                <span style="font-size:20px;">🎨</span>
                <span>SKIN</span>
            </button>
            <button class="nav-btn play-btn" onclick="startGame()">GIOCA</button>
            <button class="nav-btn" onclick="openModal('maps-modal')">
                <span style="font-size:20px;">🗺️</span>
                <span>MAPPA</span>
            </button>
            <button class="nav-btn" onclick="openModal('multiplayer-modal')">
                <span style="font-size:20px;">💬</span>
                <span>SOCIAL</span>
            </button>
        </div>
    </div>

    <!-- MODALS -->
    <div id="brawlers-modal" class="modal">
        <div class="modal-header">
            <div class="modal-title">SELEZIONA BRAWLER</div>
            <button class="close-btn" onclick="closeModal('brawlers-modal')">✕</button>
        </div>
        <div class="grid-list" id="brawlers-list"></div>
    </div>

    <div id="skins-modal" class="modal">
        <div class="modal-header">
            <div class="modal-title">SKIN DISPONIBILI</div>
            <button class="close-btn" onclick="closeModal('skins-modal')">✕</button>
        </div>
        <div class="grid-list" id="skins-list"></div>
    </div>

    <div id="maps-modal" class="modal">
        <div class="modal-header">
            <div class="modal-title">SELEZIONA MAPPA</div>
            <button class="close-btn" onclick="closeModal('maps-modal')">✕</button>
        </div>
        <div class="grid-list" id="maps-list"></div>
    </div>

    <div id="multiplayer-modal" class="modal">
        <div class="modal-header">
            <div class="modal-title">STANZA & CLUB CHAT</div>
            <button class="close-btn" onclick="closeModal('multiplayer-modal')">✕</button>
        </div>
        <div style="margin-bottom: 12px;">
            <div style="font-size: 12px; color: #aaa; margin-bottom: 4px;">IL TUO CODICE STANZA:</div>
            <input type="text" id="my-peer-id" readonly class="chat-input" value="Generazione codice..." style="width: 100%; text-align: center; font-weight: bold; color: var(--brawl-yellow);">
        </div>
        <div style="margin-bottom: 12px; display: flex; gap: 8px;">
            <input type="text" id="join-peer-id" class="chat-input" placeholder="Codice Amico...">
            <button class="btn-bs" onclick="connectToPeer()">CONNETTI</button>
        </div>
        <div style="font-size: 13px; color: var(--brawl-blue); margin-bottom: 6px;">CHAT DEL CLUB</div>
        <div class="chat-container">
            <div class="chat-messages" id="chat-box">
                <div style="color: #666;">[Sistema]: Benvenuto nella Chat di Gruppo!</div>
            </div>
            <div class="chat-input-group">
                <input type="text" id="chat-msg" class="chat-input" placeholder="Scrivi un messaggio...">
                <button class="btn-bs" onclick="sendChatMessage()">INVIA</button>
            </div>
        </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen" class="screen">
        <canvas id="gameCanvas"></canvas>
        <div class="game-hud">
            <div style="width: 100%; display: flex; justify-content: flex-end; pointer-events: auto;">
                <button class="btn-bs" style="background: linear-gradient(180deg, #FF2A2A 0%, #990000 100%);" onclick="exitGame()">ESCI</button>
            </div>
            <div class="touch-controls">
                <div class="joystick-zone" id="joystick-zone">
                    <div class="joystick-knob" id="joystick-knob"></div>
                </div>
                <div class="action-buttons">
                    <button class="super-btn" id="btn-super">SUPER</button>
                    <button class="attack-btn" id="btn-attack">SPARA</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- VECTOR GRAPHICS ASSETS (PRO LOOK) ---
        const SVG_ASSETS = {
            shelby: `<svg viewBox="0 0 100 100" width="100%" height="100%">
                <circle cx="50" cy="50" r="45" fill="#0099FF" stroke="#000" stroke-width="4"/>
                <path d="M 20 50 Q 50 20 80 50 L 80 80 Q 50 95 20 80 Z" fill="#FFCC00" stroke="#000" stroke-width="3"/>
                <circle cx="35" cy="45" r="8" fill="#FFF" stroke="#000" stroke-width="2"/>
                <circle cx="65" cy="45" r="8" fill="#FFF" stroke="#000" stroke-width="2"/>
                <circle cx="37" cy="45" r="4" fill="#000"/>
                <circle cx="67" cy="45" r="4" fill="#000"/>
                <path d="M 30 25 Q 50 10 70 25 L 80 35 L 20 35 Z" fill="#990000" stroke="#000" stroke-width="3"/>
                <path d="M 40 68 Q 50 78 60 68" stroke="#000" stroke-width="4" fill="none" stroke-linecap="round"/>
            </svg>`,
            bull: `<svg viewBox="0 0 100 100" width="100%" height="100%">
                <circle cx="50" cy="50" r="45" fill="#FF2A2A" stroke="#000" stroke-width="4"/>
                <path d="M 10 30 Q 0 10 25 20 Z" fill="#FFF" stroke="#000" stroke-width="3"/>
                <path d="M 90 30 Q 100 10 75 20 Z" fill="#FFF" stroke="#000" stroke-width="3"/>
                <circle cx="35" cy="45" r="7" fill="#FFF" stroke="#000" stroke-width="2"/>
                <circle cx="65" cy="45" r="7" fill="#FFF" stroke="#000" stroke-width="2"/>
                <circle cx="35" cy="45" r="3" fill="#000"/>
                <circle cx="65" cy="45" r="3" fill="#000"/>
                <path d="M 30 25 L 70 25 L 50 40 Z" fill="#333" stroke="#000" stroke-width="2"/>
                <circle cx="50" cy="65" r="10" fill="#FFCC00" stroke="#000" stroke-width="3"/>
                <circle cx="50" cy="65" r="5" fill="#FF2A2A"/>
            </svg>`,
            crow: `<svg viewBox="0 0 100 100" width="100%" height="100%">
                <circle cx="50" cy="50" r="45" fill="#A628F7" stroke="#000" stroke-width="4"/>
                <path d="M 25 50 L 75 50 L 50 90 Z" fill="#FF6600" stroke="#000" stroke-width="4"/>
                <ellipse cx="35" cy="40" rx="8" ry="12" fill="#FFF" stroke="#000" stroke-width="2"/>
                <ellipse cx="65" cy="40" rx="8" ry="12" fill="#FFF" stroke="#000" stroke-width="2"/>
                <circle cx="35" cy="40" r="4" fill="#FF2A2A"/>
                <circle cx="65" cy="40" r="4" fill="#FF2A2A"/>
                <path d="M 20 20 L 50 35 L 80 20 L 50 10 Z" fill="#1A2434" stroke="#000" stroke-width="3"/>
            </svg>`
        };

        const BRAWLERS = [
            { 
                id: 'shelby', name: 'SHELBY', rarity: 'Comune', rarityColor: '#0099FF', color: '#0099FF', 
                hp: 1200, damage: 210, speed: 3.8, range: 'Medio', class: 'Danni', desc: 'Spara una raffica di pallini ad ampio raggio con il suo fucile.',
                svg: SVG_ASSETS.shelby
            },
            { 
                id: 'bull', name: 'BULL', rarity: 'Raro', rarityColor: '#00E640', color: '#FF2A2A', 
                hp: 1800, damage: 340, speed: 3.2, range: 'Corto', class: 'Peso Massimo', desc: 'Devastante a distanza ravvicinata, dotato di elevata salute.',
                svg: SVG_ASSETS.bull
            },
            { 
                id: 'crow', name: 'CROW', rarity: 'Leggendario', rarityColor: '#FFCC00', color: '#A628F7', 
                hp: 900, damage: 160, speed: 4.5, range: 'Lungo', class: 'Assassino', desc: 'Lancia pugnali veloci ed è estremamente rapido nei movimenti.',
                svg: SVG_ASSETS.crow
            }
        ];

        const SKINS = [
            { id: 'default', name: 'Predefinita', color: null },
            { id: 'gold', name: 'Oro Puro', color: '#FFCC00' },
            { id: 'mecha', name: 'Mecha Cyber', color: '#00E5FF' }
        ];

        const MAPS = [
            { id: 'gem_grab', name: 'Miniera Gemme', mode: '3v3 Standard', bg: '#2E4C1E', gridColor: '#243D17', wallColor: '#5C4033', bestBrawler: 'Shelby, Crow', desc: 'Controllo della miniera centrale ed eliminazione avversaria.', mapType: 'gems' },
            { id: 'brawl_ball', name: 'Stadio Brawl', mode: 'Azione Sportiva', bg: '#1E3A5F', gridColor: '#162C48', wallColor: '#3B4D6B', bestBrawler: 'Bull', desc: 'Segna due goal nella porta avversaria superando le difese.', mapType: 'ball' },
            { id: 'desert', name: 'Canyon Secco', mode: 'Sopravvivenza', bg: '#8B4513', gridColor: '#72380F', wallColor: '#A0522D', bestBrawler: 'Crow', desc: 'Mappa aperta ricca di rocce tattiche e cespugli densi.', mapType: 'desert' }
        ];

        let currentBrawler = BRAWLERS[0];
        let currentSkin = SKINS[0];
        let currentMap = MAPS[0];

        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        function renderSelectionLists() {
            const bContainer = document.getElementById('brawlers-list');
            bContainer.innerHTML = '';
            BRAWLERS.forEach(b => {
                const item = document.createElement('div');
                item.className = `card-item ${currentBrawler.id === b.id ? 'selected' : ''}`;
                item.onclick = () => { currentBrawler = b; updateLobbyDisplay(); renderSelectionLists(); closeModal('brawlers-modal'); };
                item.innerHTML = `
                    <div class="card-img-box" style="border-color:${b.rarityColor}">${b.svg}</div>
                    <div class="card-info">
                        <div class="card-title">${b.name} <span style="font-size:12px; color:${b.rarityColor};">(${b.rarity})</span></div>
                        <div style="font-size:11px; color:#CBD5E1;">${b.desc}</div>
                        <div class="card-stats">
                            <span class="stat-badge">❤️ HP: ${b.hp}</span>
                            <span class="stat-badge">⚔️ Danno: ${b.damage}</span>
                            <span class="stat-badge">⚡ Vel: ${b.speed}</span>
                        </div>
                    </div>`;
                bContainer.appendChild(item);
            });

            const sContainer = document.getElementById('skins-list');
            sContainer.innerHTML = '';
            SKINS.forEach(s => {
                const item = document.createElement('div');
                item.className = `card-item ${currentSkin.id === s.id ? 'selected' : ''}`;
                item.onclick = () => { currentSkin = s; updateLobbyDisplay(); renderSelectionLists(); closeModal('skins-modal'); };
                item.innerHTML = `
                    <div class="card-img-box">${currentBrawler.svg}</div>
                    <div class="card-info">
                        <div class="card-title">${s.name}</div>
                        <div style="font-size:12px; color:#aaa;">Skin personalizzata per ${currentBrawler.name}</div>
                    </div>`;
                sContainer.appendChild(item);
            });

            const mContainer = document.getElementById('maps-list');
            mContainer.innerHTML = '';
            MAPS.forEach(m => {
                const item = document.createElement('div');
                item.className = `card-item ${currentMap.id === m.id ? 'selected' : ''}`;
                item.onclick = () => { currentMap = m; renderSelectionLists(); closeModal('maps-modal'); };
                item.innerHTML = `
                    <div class="card-img-box" style="background:${m.bg}">🗺️</div>
                    <div class="card-info">
                        <div class="card-title">${m.name} <span style="font-size:11px; color:var(--brawl-yellow);">[${m.mode}]</span></div>
                        <div style="font-size:11px; color:#CBD5E1;">${m.desc}</div>
                    </div>`;
                mContainer.appendChild(item);
            });
        }

        function updateLobbyDisplay() {
            document.getElementById('lobby-brawler-name').innerText = currentBrawler.name;
            document.getElementById('lobby-rarity-tag').innerText = `${currentBrawler.rarity} - ${currentBrawler.class}`;
            document.getElementById('lobby-rarity-tag').style.backgroundColor = currentBrawler.rarityColor;
            document.getElementById('lobby-brawler-img').innerHTML = currentBrawler.svg;
        }

        function toggleFullScreen() {
            let doc = window.document;
            let docEl = doc.documentElement;
            let requestFullScreen = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
            let cancelFullScreen = doc.exitFullscreen || doc.mozCancelFullScreen || doc.webkitExitFullscreen || doc.msExitFullscreen;

            if(!doc.fullscreenElement && !doc.mozFullScreenElement && !doc.webkitFullscreenElement && !doc.msFullscreenElement) {
                requestFullScreen.call(docEl);
            } else {
                cancelFullScreen.call(doc);
            }
        }

        /* --- ENGINE DEL GIOCO E MAPPE --- */
        let canvas, ctx;
        let gameRunning = false;
        let player = { x: 0, y: 0, radius: 22, hp: 1000, maxHp: 1000, vx: 0, vy: 0, angle: 0, score: 0 };
        let enemy = { x: 0, y: 0, radius: 22, hp: 1200, maxHp: 1200, vx: 1.5, vy: 1.5, brawler: BRAWLERS[1] };
        let bullets = [];
        let mapObstacles = [];
        let mapBushes = [];
        let brawlerImages = {};

        // Pre-rendering immagini SVG per il Canvas 2D
        function cacheBrawlerSVGs() {
            BRAWLERS.forEach(b => {
                const img = new Image();
                const blob = new Blob([b.svg], {type: 'image/svg+xml'});
                img.src = URL.createObjectURL(blob);
                brawlerImages[b.id] = img;
            });
        }

        function buildMapLayout() {
            mapObstacles = [];
            mapBushes = [];
            const w = canvas.width;
            const h = canvas.height;

            // Muri perimetrali rigidi e blocchi strutturati
            const addWall = (x, y, width, height) => {
                mapObstacles.push({ x, y, w: width, h: height });
            };

            const addBush = (x, y, radius) => {
                mapBushes.push({ x, y, r: radius });
            };

            // Layout strutturati coerenti per tipologia di mappa
            if (currentMap.mapType === 'gems') {
                // Blocchi centrali difensivi
                addWall(w * 0.3, h * 0.4, 80, 40);
                addWall(w * 0.7 - 80, h * 0.4, 80, 40);
                addWall(w * 0.3, h * 0.6, 80, 40);
                addWall(w * 0.7 - 80, h * 0.6, 80, 40);
                // Cespugli tattici lateralmente
                addBush(w * 0.15, h * 0.5, 50);
                addBush(w * 0.85, h * 0.5, 50);
            } else if (currentMap.mapType === 'ball') {
                // Muri laterali stile stadio
                addWall(w * 0.2, h * 0.2, 40, 120);
                addWall(w * 0.8 - 40, h * 0.2, 40, 120);
                addWall(w * 0.2, h * 0.8 - 120, 40, 120);
                addWall(w * 0.8 - 40, h * 0.8 - 120, 40, 120);
                addBush(w * 0.5, h * 0.25, 60);
                addBush(w * 0.5, h * 0.75, 60);
            } else {
                // Layout Deserto Labirintico
                addWall(w * 0.25, h * 0.3, 100, 30);
                addWall(w * 0.65, h * 0.3, 30, 100);
                addWall(w * 0.35, h * 0.7, 30, 100);
                addWall(w * 0.65, h * 0.7, 100, 30);
                addBush(w * 0.5, h * 0.5, 70);
            }
        }

        function startGame() {
            document.getElementById('lobby-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');

            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            player.x = canvas.width / 2;
            player.y = canvas.height * 0.8;
            player.hp = currentBrawler.hp;
            player.maxHp = currentBrawler.hp;
            player.score = 0;

            enemy.x = canvas.width / 2;
            enemy.y = canvas.height * 0.2;
            enemy.hp = enemy.brawler.hp;
            enemy.maxHp = enemy.brawler.hp;

            bullets = [];
            buildMapLayout();
            gameRunning = true;
            initJoystick();
            bindActionButtons();
            requestAnimationFrame(gameLoop);
        }

        function exitGame() {
            gameRunning = false;
            document.getElementById('game-screen').classList.remove('active');
            document.getElementById('lobby-screen').classList.add('active');
        }

        function triggerAttack() {
            if(!gameRunning) return;
            bullets.push({
                x: player.x,
                y: player.y,
                vx: Math.cos(player.angle) * 12,
                vy: Math.sin(player.angle) * 12,
                radius: 8,
                damage: currentBrawler.damage,
                isPlayer: true
            });
        }

        function triggerSuper() {
            if(!gameRunning) return;
            for(let i = -2; i <= 2; i++) {
                let a = player.angle + (i * 0.2);
                bullets.push({
                    x: player.x,
                    y: player.y,
                    vx: Math.cos(a) * 15,
                    vy: Math.sin(a) * 15,
                    radius: 12,
                    damage: currentBrawler.damage * 1.4,
                    isSuper: true,
                    isPlayer: true
                });
            }
        }

        function bindActionButtons() {
            const btnAttack = document.getElementById('btn-attack');
            const btnSuper = document.getElementById('btn-super');

            const handleBtn = (element, callback) => {
                element.onpointerdown = (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    callback();
                };
            };

            handleBtn(btnAttack, triggerAttack);
            handleBtn(btnSuper, triggerSuper);
        }

        function checkWallCollisions(ent) {
            mapObstacles.forEach(w => {
                if (ent.x + ent.radius > w.x && ent.x - ent.radius < w.x + w.w &&
                    ent.y + ent.radius > w.y && ent.y - ent.radius < w.y + w.h) {
                    ent.x -= ent.vx;
                    ent.y -= ent.vy;
                }
            });
        }

        function updateGameLogic() {
            // Movimento Giocatore
            player.x += player.vx;
            player.y += player.vy;
            player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
            player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));
            checkWallCollisions(player);

            // IA Nemico Semplificata
            enemy.x += enemy.vx;
            enemy.y += enemy.vy;
            if(enemy.x < 50 || enemy.x > canvas.width - 50) enemy.vx *= -1;
            if(enemy.y < 50 || enemy.y > canvas.height * 0.5) enemy.vy *= -1;
            checkWallCollisions(enemy);

            // Proiettili
            for(let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += b.vx;
                b.y += b.vy;

                // Collisione Nemico
                if(b.isPlayer) {
                    let dx = b.x - enemy.x;
                    let dy = b.y - enemy.y;
                    if(Math.sqrt(dx*dx + dy*dy) < b.radius + enemy.radius) {
                        enemy.hp -= b.damage;
                        if(enemy.hp <= 0) enemy.hp = enemy.maxHp;
                        bullets.splice(i, 1);
                        continue;
                    }
                }

                // Collisione Muri
                mapObstacles.forEach(w => {
                    if (b.x > w.x && b.x < w.x + w.w && b.y > w.y && b.y < w.y + w.h) {
                        bullets.splice(i, 1);
                    }
                });

                if(b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
                    bullets.splice(i, 1);
                }
            }
        }

        function drawCharacter(ent, brawlerData, isPlayer) {
            ctx.save();
            ctx.translate(ent.x, ent.y);

            // Anello Selezionatore alla base (Stile Brawl Stars)
            ctx.beginPath();
            ctx.ellipse(0, ent.radius - 2, ent.radius, ent.radius / 2, 0, 0, Math.PI * 2);
            ctx.fillStyle = isPlayer ? 'rgba(0, 230, 64, 0.4)' : 'rgba(255, 42, 42, 0.4)';
            ctx.fill();
            ctx.strokeStyle = isPlayer ? '#00E640' : '#FF2A2A';
            ctx.lineWidth = 3;
            ctx.stroke();

            // Avatar del Brawler Effettivo
            const img = brawlerImages[brawlerData.id];
            if (img) {
                ctx.drawImage(img, -ent.radius, -ent.radius - 5, ent.radius * 2, ent.radius * 2);
            }

            ctx.restore();

            // BARRA DELLA VITA E NOME PROPRIO SOPRA IL PERSONAGGIO
            const barWidth = 50;
            const barHeight = 8;
            const barX = ent.x - barWidth / 2;
            const barY = ent.y - ent.radius - 24;

            // Sfondo barra
            ctx.fillStyle = '#000';
            ctx.fillRect(barX - 2, barY - 2, barWidth + 4, barHeight + 4);

            // Riempimento vita
            const hpPct = Math.max(0, ent.hp / ent.maxHp);
            ctx.fillStyle = isPlayer ? '#00E640' : '#FF2A2A';
            ctx.fillRect(barX, barY, barWidth * hpPct, barHeight);

            // Nome Personaggio
            ctx.font = '10px "Lilita One"';
            ctx.fillStyle = '#FFF';
            ctx.textAlign = 'center';
            ctx.fillText(brawlerData.name, ent.x, barY - 4);
        }

        function drawGame() {
            // Sfondo Campi di Gioco
            ctx.fillStyle = currentMap.bg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Griglia Terreno
            ctx.strokeStyle = currentMap.gridColor;
            ctx.lineWidth = 2;
            const gridSize = 40;
            for(let x = 0; x < canvas.width; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for(let y = 0; y < canvas.height; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // Disegna Muri (Ostacoli 3D)
            mapObstacles.forEach(w => {
                ctx.fillStyle = currentMap.wallColor;
                ctx.fillRect(w.x, w.y, w.w, w.h);
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 3;
                ctx.strokeRect(w.x, w.y, w.w, w.h);
                // Ombra Muro
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.fillRect(w.x, w.y + w.h - 6, w.w, 6);
            });

            // Disegna Cespugli
            mapBushes.forEach(b => {
                ctx.fillStyle = 'rgba(0, 153, 51, 0.75)';
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#004D1A';
                ctx.lineWidth = 3;
                ctx.stroke();
            });

            // Disegna Nemico e Giocatore
            drawCharacter(enemy, enemy.brawler, false);
            drawCharacter(player, currentBrawler, true);

            // Disegna Proiettili
            bullets.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fillStyle = b.isSuper ? '#A628F7' : '#FFCC00';
                ctx.fill();
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.stroke();
            });
        }

        function gameLoop() {
            if(!gameRunning) return;
            updateGameLogic();
            drawGame();
            requestAnimationFrame(gameLoop);
        }

        function initJoystick() {
            const zone = document.getElementById('joystick-zone');
            const knob = document.getElementById('joystick-knob');
            let active = false;
            let touchId = null;
            let startX, startY;

            zone.addEventListener('pointerdown', e => {
                active = true;
                touchId = e.pointerId;
                zone.setPointerCapture(e.pointerId);
                let rect = zone.getBoundingClientRect();
                startX = rect.left + rect.width / 2;
                startY = rect.top + rect.height / 2;
            });

            zone.addEventListener('pointermove', e => {
                if(!active || e.pointerId !== touchId) return;
                let dx = e.clientX - startX;
                let dy = e.clientY - startY;
                let dist = Math.sqrt(dx*dx + dy*dy);
                let maxRadius = 40;

                if(dist > maxRadius) {
                    dx = (dx / dist) * maxRadius;
                    dy = (dy / dist) * maxRadius;
                }

                knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;

                player.vx = (dx / maxRadius) * currentBrawler.speed;
                player.vy = (dy / maxRadius) * currentBrawler.speed;
                if(dx !== 0 || dy !== 0) {
                    player.angle = Math.atan2(dy, dx);
                }
            });

            const handlePointerUp = e => {
                if (e.pointerId === touchId) {
                    active = false;
                    touchId = null;
                    knob.style.transform = `translate(-50%, -50%)`;
                    player.vx = 0;
                    player.vy = 0;
                }
            };

            zone.addEventListener('pointerup', handlePointerUp);
            zone.addEventListener('pointercancel', handlePointerUp);
        }

        // Multiplayer / PeerJS
        let peer = new Peer();
        let conn = null;

        peer.on('open', id => { document.getElementById('my-peer-id').value = id; });
        peer.on('connection', c => { conn = c; setupChatConnection(); });

        function connectToPeer() {
            let remoteId = document.getElementById('join-peer-id').value;
            if(!remoteId) return;
            conn = peer.connect(remoteId);
            setupChatConnection();
        }

        function setupChatConnection() {
            conn.on('data', data => {
                if(data.type === 'chat') appendChatMessage("Amico", data.msg);
            });
            appendChatMessage("Sistema", "Connesso con successo!");
        }

        function sendChatMessage() {
            let msgInput = document.getElementById('chat-msg');
            let msg = msgInput.value;
            if(!msg) return;

            appendChatMessage("Tu", msg);
            if(conn) conn.send({ type: 'chat', msg: msg });
            msgInput.value = '';
        }

        function appendChatMessage(author, msg) {
            let box = document.getElementById('chat-box');
            let div = document.createElement('div');
            div.innerHTML = `<strong>${author}:</strong> ${msg}`;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        // Inizializzazione
        cacheBrawlerSVGs();
        renderSelectionLists();
        updateLobbyDisplay();
    </script>
</body>
</html>
