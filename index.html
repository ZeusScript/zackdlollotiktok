<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brawl Stars Web Edition</title>
    <style>
        :root {
            --bs-yellow: #facc15;
            --bs-blue: #2563eb;
            --bs-purple: #9333ea;
            --bs-red: #ef4444;
            --bs-green: #22c55e;
            --bs-dark: #0f172a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Arial Black', Impact, sans-serif; }
        body { background: #030712; color: #fff; overflow: hidden; height: 100vh; width: 100vw; display: flex; justify-content: center; align-items: center; }

        /* --- INTERFACCIA LOBBY STILE BRAWL --- */
        .screen { position: absolute; width: 100%; height: 100%; display: none; flex-direction: column; justify-content: space-between; padding: 15px; background: radial-gradient(circle, #1e1b4b 0%, #0f172a 100%); }
        .screen.active { display: flex; }

        /* HEADER CURRENCIES */
        .top-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 900px; margin: 0 auto; z-index: 10; }
        .profile-box { display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,0.6); padding: 8px 15px; border-radius: 30px; border: 3px solid #6366f1; }
        .trophy-badge { color: var(--bs-yellow); font-size: 1.2rem; display: flex; align-items: center; gap: 5px; text-shadow: 2px 2px #000; }
        
        .currencies { display: flex; gap: 10px; }
        .currency-item { background: rgba(0,0,0,0.7); border: 3px solid #38bdf8; border-radius: 20px; padding: 5px 12px; font-size: 1rem; display: flex; align-items: center; gap: 6px; text-shadow: 2px 2px #000; }
        .currency-item.gems { border-color: var(--bs-green); }

        /* LOBBY MAIN DISPLAY */
        .lobby-center { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; }
        .brawler-preview { width: 160px; height: 160px; border-radius: 50%; border: 6px solid var(--bs-yellow); box-shadow: 0 0 30px rgba(250, 204, 21, 0.5); display: flex; justify-content: center; align-items: center; font-size: 4rem; background: #312e81; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }

        .brawler-name { font-size: 2.2rem; color: var(--bs-yellow); text-shadow: 3px 3px #000, -2px -2px #000; margin-top: 15px; text-transform: uppercase; }

        /* BOTTOM NAV BAR */
        .bottom-nav { display: flex; justify-content: center; gap: 15px; width: 100%; max-width: 800px; margin: 0 auto; z-index: 10; }
        .btn-bs { padding: 14px 24px; border: 4px solid #fff; border-radius: 16px; font-size: 1.2rem; font-weight: 900; color: #fff; cursor: pointer; text-shadow: 2px 2px #000; box-shadow: 0 8px 0 #000; transition: transform 0.1s; text-transform: uppercase; }
        .btn-bs:active { transform: translateY(4px); box-shadow: 0 4px 0 #000; }
        .btn-play { background: var(--bs-yellow); color: #000; text-shadow: none; font-size: 1.8rem; padding: 16px 50px; border-color: #fef08a; box-shadow: 0 10px 0 #ca8a04; }
        .btn-brawlers { background: var(--bs-purple); border-color: #c084fc; box-shadow: 0 8px 0 #6b21a8; }
        .btn-shop { background: var(--bs-blue); border-color: #60a5fa; box-shadow: 0 8px 0 #1e40af; }

        /* --- SCHERMATA BRAWLERS --- */
        .brawlers-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; width: 100%; max-width: 800px; margin: 20px auto; overflow-y: auto; max-height: 70vh; padding: 10px; }
        .brawler-card { background: #1e293b; border: 4px solid #475569; border-radius: 16px; padding: 15px; text-align: center; cursor: pointer; position: relative; }
        .brawler-card.selected { border-color: var(--bs-yellow); box-shadow: 0 0 20px var(--bs-yellow); }
        .brawler-card.locked { opacity: 0.5; filter: grayscale(1); }
        .brawler-icon { font-size: 3rem; margin-bottom: 5px; }

        /* --- SCHERMATA NEGOZIO & CASSE --- */
        .shop-container { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin: auto; }
        .shop-item { background: #1e1b4b; border: 4px solid var(--bs-yellow); border-radius: 20px; padding: 25px; text-align: center; width: 220px; box-shadow: 0 10px 0 #000; }
        .box-icon { font-size: 5rem; margin: 10px 0; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }

        /* MODALE APERTURA CASSA */
        #box-modal { position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
        #box-modal h2 { font-size: 3rem; color: var(--bs-yellow); text-shadow: 3px 3px #000; margin-bottom: 20px; }
        .reward-card { font-size: 2rem; background: #312e81; border: 4px solid #fff; padding: 20px 40px; border-radius: 20px; animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes pop { 0% { transform: scale(0); } 100% { transform: scale(1); } }

        /* --- SCHERMATA BATTAGLIA (CANVAS) --- */
        #game-container { position: relative; width: 100vw; height: 100vh; display: none; }
        canvas { background: #15803d; border: 6px solid #166534; cursor: crosshair; }
        .hud { position: absolute; top: 15px; left: 15px; display: flex; gap: 10px; pointer-events: none; }
        .hud-box { background: rgba(0,0,0,0.7); padding: 8px 16px; border-radius: 12px; border: 2px solid #fff; font-size: 1.1rem; }
    </style>
</head>
<body>

    <!-- LOBBY PRINCIPALE -->
    <div id="lobby-screen" class="screen active">
        <div class="top-bar">
            <div class="profile-box">
                <span>👤</span>
                <span id="player-name">BrawlerPro</span>
                <div class="trophy-badge">🏆 <span id="trophies-count">0</span></div>
            </div>
            <div class="currencies">
                <div class="currency-item">🪙 <span id="coins-count">100</span></div>
                <div class="currency-item gems">💎 <span id="gems-count">20</span></div>
            </div>
        </div>

        <div class="lobby-center">
            <div id="current-avatar" class="brawler-preview">🤠</div>
            <div id="current-name" class="brawler-name">SHELLY</div>
            <p style="color: #94a3b8; font-size: 0.9rem; margin-top: 5px;">Livello Brawler: 1</p>
        </div>

        <div class="bottom-nav">
            <button class="btn-bs btn-shop" onclick="showScreen('shop-screen')">🛒 NEGOZIO</button>
            <button class="btn-bs btn-brawlers" onclick="showScreen('brawlers-screen')">🥊 BRAWLERS</button>
            <button class="btn-bs btn-play" onclick="startBattle()">BRAWL!</button>
        </div>
    </div>

    <!-- SELEZIONE BRAWLERS -->
    <div id="brawlers-screen" class="screen">
        <h1 style="text-align: center; color: var(--bs-yellow); margin-top: 10px;">SELEZIONA BRAWLER</h1>
        <div class="brawlers-grid" id="brawlers-list"></div>
        <div class="bottom-nav">
            <button class="btn-bs btn-shop" onclick="showScreen('lobby-screen')">⬅️ LOBBY</button>
        </div>
    </div>

    <!-- NEGOZIO CASSE -->
    <div id="shop-screen" class="screen">
        <h1 style="text-align: center; color: var(--bs-yellow); margin-top: 10px;">NEGOZIO BRAWL</h1>
        <div class="shop-container">
            <div class="shop-item">
                <h2>BRAWL BOX</h2>
                <div class="box-icon">📦</div>
                <p style="color: #94a3b8; margin-bottom: 15px;">Trova monete, gemme e nuovi Brawler!</p>
                <button class="btn-bs btn-play" style="font-size: 1rem; padding: 10px 20px;" onclick="openBox(100)">100 🪙</button>
            </div>
        </div>
        <div class="bottom-nav">
            <button class="btn-bs btn-shop" onclick="showScreen('lobby-screen')">⬅️ LOBBY</button>
        </div>
    </div>

    <!-- MODALE CASSA -->
    <div id="box-modal">
        <h2>CASSA APERTA!</h2>
        <div id="reward-display" class="reward-card">+50 Monete!</div>
        <button class="btn-bs btn-play" style="margin-top: 30px;" onclick="closeBox()">RITIRA</button>
    </div>

    <!-- CAMPO DI BATTAGLIA -->
    <div id="game-container">
        <canvas id="canvas"></canvas>
        <div class="hud">
            <div class="hud-box" style="color: var(--bs-yellow);">🏆 COPPE: <span id="game-trophies">0</span></div>
            <div class="hud-box" style="color: #60a5fa;">🥊 SCONFITTI: <span id="game-kills">0</span></div>
        </div>
    </div>

    <script>
        // DATI BRAWLERS DISPONIBILI
        const BRAWLERS = {
            shelly: { id: 'shelly', name: 'SHELLY', icon: '🤠', hp: 120, speed: 4.2, attackType: 'spread', damage: 18, unlocked: true },
            colt: { id: 'colt', name: 'COLT', icon: '🔫', hp: 90, speed: 4.8, attackType: 'burst', damage: 14, unlocked: true },
            el_primo: { id: 'el_primo', name: 'EL PRIMO', icon: '🤼', hp: 180, speed: 3.8, attackType: 'melee', damage: 35, unlocked: false },
            spike: { id: 'spike', name: 'SPIKE', icon: '🌵', hp: 80, speed: 4.5, attackType: 'spike', damage: 40, unlocked: false }
        };

        // STATO GIOCATORE CON SALVATAGGIO AUTOMATICO
        let playerData = JSON.parse(localStorage.getItem('bs_player_data')) || {
            trophies: 0,
            coins: 150,
            gems: 20,
            selectedBrawler: 'shelly',
            unlockedBrawlers: ['shelly', 'colt']
        };

        function saveData() {
            localStorage.setItem('bs_player_data', JSON.stringify(playerData));
            updateUI();
        }

        function updateUI() {
            document.getElementById('trophies-count').textContent = playerData.trophies;
            document.getElementById('coins-count').textContent = playerData.coins;
            document.getElementById('gems-count').textContent = playerData.gems;
            
            const brawler = BRAWLERS[playerData.selectedBrawler];
            document.getElementById('current-avatar').textContent = brawler.icon;
            document.getElementById('current-name').textContent = brawler.name;
            renderBrawlersList();
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('game-container').style.display = 'none';
            document.getElementById(screenId).classList.add('active');
        }

        function renderBrawlersList() {
            const list = document.getElementById('brawlers-list');
            list.innerHTML = '';
            
            Object.values(BRAWLERS).forEach(b => {
                const isUnlocked = playerData.unlockedBrawlers.includes(b.id);
                const isSelected = playerData.selectedBrawler === b.id;
                
                const card = document.createElement('div');
                card.className = `brawler-card ${isSelected ? 'selected' : ''} ${!isUnlocked ? 'locked' : ''}`;
                card.innerHTML = `
                    <div class="brawler-icon">${b.icon}</div>
                    <h3>${b.name}</h3>
                    <p style="font-size: 0.8rem; color: #94a3b8;">${isUnlocked ? (isSelected ? 'SELEZIONATO' : 'CLICCA PER USARE') : 'BLOCCATO (Sblocca nelle Casse)'}</p>
                `;
                if (isUnlocked) {
                    card.onclick = () => {
                        playerData.selectedBrawler = b.id;
                        saveData();
                        showScreen('lobby-screen');
                    };
                }
                list.appendChild(card);
            });
        }

        // NEGOZIO & APERTURA CASSE
        function openBox(cost) {
            if (playerData.coins < cost) return alert('Monete insufficienti!');
            playerData.coins -= cost;

            const rand = Math.random();
            let rewardText = '';

            if (rand < 0.4) {
                const coinsGained = Math.floor(Math.random() * 60) + 40;
                playerData.coins += coinsGained;
                rewardText = `🪙 +${coinsGained} Monete!`;
            } else if (rand < 0.7) {
                const gemsGained = Math.floor(Math.random() * 8) + 3;
                playerData.gems += gemsGained;
                rewardText = `💎 +${gemsGained} Gemme!`;
            } else {
                // Sblocca Brawler Bloccato se esiste
                const locked = Object.keys(BRAWLERS).filter(id => !playerData.unlockedBrawlers.includes(id));
                if (locked.length > 0) {
                    const newBrawler = locked[Math.floor(Math.random() * locked.length)];
                    playerData.unlockedBrawlers.push(newBrawler);
                    rewardText = `🎉 NUOVO BRAWLER: ${BRAWLERS[newBrawler].name} ${BRAWLERS[newBrawler].icon}!`;
                } else {
                    playerData.coins += 100;
                    rewardText = `🪙 +100 Monete!`;
                }
            }

            saveData();
            document.getElementById('reward-display').textContent = rewardText;
            document.getElementById('box-modal').style.display = 'flex';
        }

        function closeBox() {
            document.getElementById('box-modal').style.display = 'none';
        }

        // --- MOTORE DI GIOCO BATTAGLIA (CANVAS) ---
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let gameActive = false;
        let kills = 0;
        let keys = {};
        let mouse = { x: 0, y: 0 };
        let bullets = [];
        let enemies = [];
        let player = {};

        function startBattle() {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('game-container').style.display = 'block';
            
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const brawlerStats = BRAWLERS[playerData.selectedBrawler];
            player = {
                x: canvas.width / 2,
                y: canvas.height / 2,
                radius: 22,
                hp: brawlerStats.hp,
                maxHp: brawlerStats.hp,
                speed: brawlerStats.speed,
                attackType: brawlerStats.attackType,
                damage: brawlerStats.damage,
                icon: brawlerStats.icon,
                ammo: 3,
                maxAmmo: 3,
                ammoTimer: 0
            };

            bullets = [];
            enemies = [];
            kills = 0;
            gameActive = true;
            document.getElementById('game-kills').textContent = kills;
            document.getElementById('game-trophies').textContent = playerData.trophies;

            requestAnimationFrame(gameLoop);
        }

        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
        canvas.addEventListener('mousemove', e => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
        });
        canvas.addEventListener('mousedown', shoot);

        function shoot() {
            if (!gameActive || player.ammo < 1) return;
            player.ammo--;

            let angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);

            // Tipi di attacco specifici per Brawler
            if (player.attackType === 'spread') { // Shelly Ventaglio
                for (let i = -2; i <= 2; i++) {
                    let spreadAngle = angle + (i * 0.15);
                    bullets.push({ x: player.x, y: player.y, dx: Math.cos(spreadAngle) * 11, dy: Math.sin(spreadAngle) * 11, radius: 5, damage: player.damage });
                }
            } else if (player.attackType === 'burst') { // Colt Raffica
                for (let i = 0; i < 4; i++) {
                    setTimeout(() => {
                        if (gameActive) bullets.push({ x: player.x, y: player.y, dx: Math.cos(angle) * 14, dy: Math.sin(angle) * 14, radius: 6, damage: player.damage });
                    }, i * 70);
                }
            } else if (player.attackType === 'melee') { // El Primo
                bullets.push({ x: player.x, y: player.y, dx: Math.cos(angle) * 8, dy: Math.sin(angle) * 8, radius: 25, damage: player.damage, life: 10 });
            } else { // Spike
                bullets.push({ x: player.x, y: player.y, dx: Math.cos(angle) * 10, dy: Math.sin(angle) * 10, radius: 9, damage: player.damage });
            }
        }

        function spawnEnemy() {
            if (!gameActive) return;
            let x = Math.random() < 0.5 ? 0 : canvas.width;
            let y = Math.random() * canvas.height;
            enemies.push({ x, y, radius: 20, hp: 80, maxHp: 80, speed: 2 });
        }
        setInterval(spawnEnemy, 2200);

        function update() {
            if (!gameActive) return;

            // Movimento
            if ((keys['w'] || keys['arrowup']) && player.y > player.radius) player.y -= player.speed;
            if ((keys['s'] || keys['arrowdown']) && player.y < canvas.height - player.radius) player.y += player.speed;
            if ((keys['a'] || keys['arrowleft']) && player.x > player.radius) player.x -= player.speed;
            if ((keys['d'] || keys['arrowright']) && player.x < canvas.width - player.radius) player.x += player.speed;

            // Ricarica Munizioni
            if (player.ammo < player.maxAmmo) {
                player.ammoTimer += 0.025;
                if (player.ammoTimer >= 1) { player.ammo++; player.ammoTimer = 0; }
            }

            // Aggiorna Proiettili
            bullets.forEach((b, i) => {
                b.x += b.dx; b.y += b.dy;
                if (b.life) { b.life--; if (b.life <= 0) bullets.splice(i, 1); }
                else if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) bullets.splice(i, 1);
            });

            // Aggiorna Nemici
            enemies.forEach((e, ei) => {
                let angle = Math.atan2(player.y - e.y, player.x - e.x);
                e.x += Math.cos(angle) * e.speed;
                e.y += Math.sin(angle) * e.speed;

                // Hit Nemici
                bullets.forEach((b, bi) => {
                    let dist = Math.hypot(b.x - e.x, b.y - e.y);
                    if (dist < b.radius + e.radius) {
                        e.hp -= b.damage;
                        bullets.splice(bi, 1);
                        if (e.hp <= 0) {
                            enemies.splice(ei, 1);
                            kills++;
                            document.getElementById('game-kills').textContent = kills;
                        }
                    }
                });

                // Hit Player
                if (Math.hypot(player.x - e.x, player.y - e.y) < player.radius + e.radius) {
                    player.hp -= 0.6;
                    if (player.hp <= 0) endMatch(false);
                }
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Disegna Proiettili
            bullets.forEach(b => {
                ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#facc15'; ctx.fill();
            });

            // Disegna Nemici
            enemies.forEach(e => {
                ctx.beginPath(); ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#ef4444'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#000'; ctx.stroke();
                // Barra HP Nemico
                ctx.fillStyle = '#000'; ctx.fillRect(e.x - 20, e.y - 30, 40, 5);
                ctx.fillStyle = '#22c55e'; ctx.fillRect(e.x - 20, e.y - 30, (e.hp / e.maxHp) * 40, 5);
            });

            // Disegna Player
            if (gameActive) {
                ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#2563eb'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.stroke();

                // Icona Brawler sopra il personaggio
                ctx.font = '20px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(player.icon, player.x, player.y);

                // Barra HP Player
                ctx.fillStyle = '#000'; ctx.fillRect(player.x - 25, player.y - 40, 50, 6);
                ctx.fillStyle = '#22c55e'; ctx.fillRect(player.x - 25, player.y - 40, Math.max(0, (player.hp / player.maxHp) * 50), 6);

                // Munizioni
                for(let i = 0; i < player.maxAmmo; i++) {
                    ctx.fillStyle = i < player.ammo ? '#f97316' : '#334155';
                    ctx.fillRect(player.x - 25 + (i * 18), player.y - 32, 14, 4);
                }
            }
        }

        function gameLoop() {
            update(); draw();
            if (gameActive) requestAnimationFrame(gameLoop);
        }

        function endMatch(won) {
            gameActive = false;
            const trophiesGained = kills * 2;
            const coinsGained = kills * 5;

            playerData.trophies += trophiesGained;
            playerData.coins += coinsGained;
            saveData();

            alert(`PARTITA FINITA!\n🥊 Sconfitti: ${kills}\n🏆 Coppe guadagnate: +${trophiesGained}\n🪙 Monete guadagnate: +${coinsGained}`);
            showScreen('lobby-screen');
        }

        // Inizializza al caricamento
        updateUI();
    </script>
</body>
</html>
