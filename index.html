<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brawl Stars 3D - Cowboy Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
    
    <!-- Librerie 3D (Three.js) e Multiplayer (PeerJS) da CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <style>
        :root {
            --font-bs: 'Lilita One', cursive, sans-serif;
            --bs-yellow: #ffe600;
            --bs-orange: #ff7700;
            --bs-blue: #0088ff;
            --bs-green: #22e652;
            --bs-red: #ff2a2a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: var(--font-bs); }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #0b0f19; color: #fff; }

        /* UI OVERLAY */
        .ui-screen {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            display: flex; flex-direction: column; justify-content: space-between; padding: 20px;
            z-index: 10; pointer-events: none;
        }

        .interactive { pointer-events: auto; }

        .btn-bs {
            padding: 12px 28px; border: 4px solid #fff; border-radius: 18px; font-size: 1.3rem;
            color: #fff; cursor: pointer; text-shadow: 2px 2px #000; letter-spacing: 1px;
            box-shadow: 0 8px 0 #000; transition: transform 0.1s, filter 0.1s; text-transform: uppercase;
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-bs:hover { filter: brightness(1.1); }
        .btn-bs:active { transform: translateY(4px); box-shadow: 0 4px 0 #000; }
        
        .btn-play { background: linear-gradient(180deg, #ffe600, #d97706); color: #000; text-shadow: none; font-size: 1.8rem; padding: 15px 50px; }
        .btn-blue { background: linear-gradient(180deg, #38bdf8, #0284c7); }
        .btn-purple { background: linear-gradient(180deg, #c084fc, #7e22ce); }

        /* MENU MULTIPLAYER */
        #menu-modal {
            position: absolute; top:0; left:0; width: 100vw; height: 100vh;
            background: rgba(11, 15, 25, 0.9); display: flex; justify-content: center;
            align-items: center; z-index: 100; backdrop-filter: blur(8px);
        }
        .modal-card {
            background: linear-gradient(180deg, #1e293b, #0f172a); border: 5px solid var(--bs-yellow);
            border-radius: 28px; padding: 30px; width: 90%; max-width: 500px; text-align: center;
            box-shadow: 0 12px 0 #000, 0 0 30px rgba(255, 230, 0, 0.4);
        }
        input[type="text"] {
            width: 100%; padding: 12px; border-radius: 12px; border: 3px solid #38bdf8;
            font-size: 1.2rem; text-align: center; margin: 15px 0; background: #0f172a; color: #fff;
        }

        /* IN-GAME HUD */
        .hud-card {
            background: rgba(15, 23, 42, 0.85); padding: 8px 20px; border-radius: 20px;
            border: 3px solid #fff; font-size: 1.2rem; text-shadow: 2px 2px #000;
            box-shadow: 0 6px 0 rgba(0,0,0,0.5);
        }

        /* CONTROLLI TOUCH MOBILE */
        .touch-zone { position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px; border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; pointer-events: auto; }
        .touch-knob { width: 50px; height: 50px; background: #fff; border-radius: 50%; position: absolute; top: 32px; left: 32px; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
    </style>
</head>
<body>

    <!-- CONTAINER THREE.JS CANVA 3D -->
    <div id="canvas-container"></div>

    <!-- UI OVERLAY -->
    <div class="ui-screen">
        <div style="display: flex; justify-content: space-between; width: 100%;">
            <div class="hud-card" style="color: var(--bs-yellow);">🤠 COWBOY BRAWLER 3D</div>
            <div class="hud-card" style="color: var(--bs-green);">STANZA MP: <span id="room-status">OFFLINE</span></div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: flex-end;">
            <div class="touch-zone interactive" id="joyZone"><div class="touch-knob" id="joyKnob"></div></div>
            <button class="btn-bs btn-play interactive" onclick="playerShoot()">SPARA 🤠</button>
        </div>
    </div>

    <!-- MODALE MENU E MULTIPLAYER -->
    <div id="menu-modal">
        <div class="modal-card">
            <h1 style="color: var(--bs-yellow); font-size: 2.5rem; text-shadow: 3px 3px #000; margin-bottom: 15px;">BRAWL 3D COWBOY</h1>
            <p style="color: #94a3b8; font-size: 0.95rem;">Gioca in Singleplayer o in Multiplayer Online inviando il codice stanza a un amico!</p>

            <div style="margin: 20px 0;">
                <button class="btn-bs btn-play" style="width: 100%; margin-bottom: 10px;" onclick="startSingleplayer()">GIOCA SOLO</button>
                <hr style="border: 1px solid #334155; margin: 15px 0;">
                
                <button class="btn-bs btn-blue" style="width: 100%; margin-bottom: 10px;" onclick="createRoom()">CREA STANZA MP</button>
                <input type="text" id="room-code-input" placeholder="INSERISCI CODICE STANZA">
                <button class="btn-bs btn-purple" style="width: 100%;" onclick="joinRoom()">ENTRA IN STANZA</button>
            </div>
            <p id="peer-id-display" style="color: var(--bs-yellow); font-size: 0.9rem; font-family: monospace;"></p>
        </div>
    </div>

    <script>
        // --- INIZIALIZZAZIONE SCENA THREE.JS (3D) ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a202c);
        scene.fog = new THREE.FogExp2(0x1a202c, 0.015);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // LUCI
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(40, 60, 20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // --- COSTRUZIONE PERSONAGGIO 3D (COWBOY CON ANIMAZIONI) ---
        function createCowboyMesh() {
            const cowboyGroup = new THREE.Group();

            // Materiali
            const skinMat = new THREE.MeshLambertMaterial({ color: 0xe0a96d });
            const hatMat = new THREE.MeshLambertMaterial({ color: 0x5c3a21 });
            const vestMat = new THREE.MeshLambertMaterial({ color: 0x854d0e });
            const jeansMat = new THREE.MeshLambertMaterial({ color: 0x1d4ed8 });
            const gunMat = new THREE.MeshLambertMaterial({ color: 0x334155 });

            // Busto / Corpo
            const torso = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.4, 0.8), vestMat);
            torso.position.y = 1.7;
            torso.castShadow = true;
            cowboyGroup.add(torso);

            // Testa
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 16), skinMat);
            head.position.y = 2.7;
            head.castShadow = true;
            cowboyGroup.add(head);

            // Cappello da Cowboy
            const hatBrim = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 0.08, 16), hatMat);
            hatBrim.position.y = 3.1;
            cowboyGroup.add(hatBrim);

            const hatTop = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.7, 0.6, 16), hatMat);
            hatTop.position.y = 3.4;
            cowboyGroup.add(hatTop);

            // Gambe (Perni per animazione camminata)
            const legGeo = new THREE.BoxGeometry(0.4, 1.2, 0.4);
            
            const leftLegGroup = new THREE.Group();
            leftLegGroup.position.set(-0.35, 1.0, 0);
            const leftLeg = new THREE.Mesh(legGeo, jeansMat);
            leftLeg.position.y = -0.6;
            leftLeg.castShadow = true;
            leftLegGroup.add(leftLeg);
            cowboyGroup.add(leftLegGroup);

            const rightLegGroup = new THREE.Group();
            rightLegGroup.position.set(0.35, 1.0, 0);
            const rightLeg = new THREE.Mesh(legGeo, jeansMat);
            rightLeg.position.y = -0.6;
            rightLeg.castShadow = true;
            rightLegGroup.add(rightLeg);
            cowboyGroup.add(rightLegGroup);

            // Braccia e Pistola
            const armGeo = new THREE.BoxGeometry(0.35, 1.1, 0.35);
            
            const leftArmGroup = new THREE.Group();
            leftArmGroup.position.set(-0.8, 2.2, 0);
            const leftArm = new THREE.Mesh(armGeo, vestMat);
            leftArm.position.y = -0.55;
            leftArmGroup.add(leftArm);
            cowboyGroup.add(leftArmGroup);

            const rightArmGroup = new THREE.Group();
            rightArmGroup.position.set(0.8, 2.2, 0);
            const rightArm = new THREE.Mesh(armGeo, vestMat);
            rightArm.position.y = -0.55;
            
            // Revolver 3D nella mano destra
            const gun = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.3, 0.8), gunMat);
            gun.position.set(0, -0.9, 0.4);
            rightArm.add(gun);

            rightArmGroup.add(rightArm);
            cowboyGroup.add(rightArmGroup);

            return {
                mesh: cowboyGroup,
                leftLeg: leftLegGroup,
                rightLeg: rightLegGroup,
                leftArm: leftArmGroup,
                rightArm: rightArmGroup
            };
        }

        // Creazione Giocatore Locale e Altri Giocatori
        const localPlayer = createCowboyMesh();
        scene.add(localPlayer.mesh);

        let remotePlayers = {}; // Per il Multiplayer

        // --- MAPPA 3D (TERRENO, ACQUA, ALBERI) ---
        function create3DMap() {
            // Terreno Erba
            const ground = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshLambertMaterial({ color: 0x15803d }));
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Fiume d'Acqua 3D
            const water = new THREE.Mesh(new THREE.BoxGeometry(15, 0.2, 100), new THREE.MeshPhongMaterial({ color: 0x0284c7, transparent: true, opacity: 0.8 }));
            water.position.set(-15, 0.05, 0);
            scene.add(water);

            // Alberi 3D
            for (let i = 0; i < 35; i++) {
                const tree = new THREE.Group();
                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.6, 3), new THREE.MeshLambertMaterial({ color: 0x78350f }));
                trunk.position.y = 1.5;
                trunk.castShadow = true;
                tree.add(trunk);

                const foliage = new THREE.Mesh(new THREE.ConeGeometry(2.5, 5, 8), new THREE.MeshLambertMaterial({ color: 0x166534 }));
                foliage.position.y = 4.5;
                foliage.castShadow = true;
                tree.add(foliage);

                let tx = (Math.random() - 0.5) * 80;
                let tz = (Math.random() - 0.5) * 80;
                if (Math.abs(tx + 15) > 10) { tree.position.set(tx, 0, tz); scene.add(tree); }
            }
        }
        create3DMap();

        // --- CONTROLLI E MOVIMENTO ---
        let keys = {};
        let moveVector = new THREE.Vector3();
        let walkTime = 0;
        let bullets = [];

        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        // SPARO PROIETTILE 3D
        function playerShoot() {
            const bullet = new THREE.Mesh(new THREE.SphereGeometry(0.25, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffe600 }));
            bullet.position.copy(localPlayer.mesh.position);
            bullet.position.y = 1.8;

            // Direzione di sparo basata sulla rotazione del cowboy
            const dir = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), localPlayer.mesh.rotation.y);
            bullet.userData = { velocity: dir.multiplyScalar(0.8), life: 60 };
            scene.add(bullet);
            bullets.push(bullet);

            // Se in multiplayer, invia l'azione dello sparo
            if (peerConn && peerConn.open) {
                peerConn.send({ type: 'shoot', x: bullet.position.x, y: bullet.position.y, z: bullet.position.z, dir: localPlayer.mesh.rotation.y });
            }
        }

        // --- SISTEMA MULTIPLAYER ONLINE (PEERJS) ---
        let peer = null;
        let peerConn = null;

        function initPeer() {
            peer = new Peer();
            peer.on('open', id => {
                document.getElementById('peer-id-display').textContent = "IL TUO CODICE: " + id;
            });

            peer.on('connection', conn => {
                peerConn = conn;
                setupConnection();
            });
        }

        function createRoom() {
            initPeer();
            document.getElementById('room-status').textContent = "IN ATTESA...";
        }

        function joinRoom() {
            const code = document.getElementById('room-code-input').value.trim();
            if (!code) return alert("Inserisci un codice valido!");
            peer = new Peer();
            peer.on('open', () => {
                peerConn = peer.connect(code);
                setupConnection();
            });
        }

        function setupConnection() {
            document.getElementById('menu-modal').style.display = 'none';
            document.getElementById('room-status').textContent = "ONLINE 🟢";

            // Crea modello 3D per l'altro giocatore
            const opponent = createCowboyMesh();
            scene.add(opponent.mesh);
            remotePlayers['opponent'] = opponent;

            peerConn.on('data', data => {
                if (data.type === 'move') {
                    opponent.mesh.position.set(data.x, data.y, data.z);
                    opponent.mesh.rotation.y = data.rot;
                    // Animazione camminata nemico
                    if (data.isWalking) {
                        opponent.leftLeg.rotation.x = Math.sin(data.walkTime) * 0.6;
                        opponent.rightLeg.rotation.x = -Math.sin(data.walkTime) * 0.6;
                    } else {
                        opponent.leftLeg.rotation.x = 0; opponent.rightLeg.rotation.x = 0;
                    }
                }
            });
        }

        function startSingleplayer() {
            document.getElementById('menu-modal').style.display = 'none';
        }

        // --- LOOP PRINCIPALE DI GIOCO & ANIMAZIONI 3D ---
        function animate() {
            requestAnimationFrame(animate);

            // Calcolo Movimento
            moveVector.set(0, 0, 0);
            if (keys['w'] || keys['arrowup']) moveVector.z -= 1;
            if (keys['s'] || keys['arrowdown']) moveVector.z += 1;
            if (keys['a'] || keys['arrowleft']) moveVector.x -= 1;
            if (keys['d'] || keys['arrowright']) moveVector.x += 1;

            const isMoving = moveVector.lengthSq() > 0;

            if (isMoving) {
                moveVector.normalize().multiplyScalar(0.2);
                localPlayer.mesh.position.add(moveVector);

                // Rotazione del Cowboy verso la direzione del movimento
                const targetAngle = Math.atan2(moveVector.x, moveVector.z);
                localPlayer.mesh.rotation.y = targetAngle;

                // Animazione Procedurale Camminata (Gambe e Braccia oscillano)
                walkTime += 0.25;
                localPlayer.leftLeg.rotation.x = Math.sin(walkTime) * 0.7;
                localPlayer.rightLeg.rotation.x = -Math.sin(walkTime) * 0.7;
                localPlayer.leftArm.rotation.x = -Math.sin(walkTime) * 0.5;
                localPlayer.rightArm.rotation.x = Math.sin(walkTime) * 0.5;
            } else {
                // Ritorno alla posizione di riposo
                localPlayer.leftLeg.rotation.x = 0;
                localPlayer.rightLeg.rotation.x = 0;
                localPlayer.leftArm.rotation.x = 0;
                localPlayer.rightArm.rotation.x = 0;
            }

            // Invia Posizione via Multiplayer
            if (peerConn && peerConn.open) {
                peerConn.send({
                    type: 'move',
                    x: localPlayer.mesh.position.x, y: localPlayer.mesh.position.y, z: localPlayer.mesh.position.z,
                    rot: localPlayer.mesh.rotation.y, isWalking: isMoving, walkTime: walkTime
                });
            }

            // Aggiorna Proiettili 3D
            bullets.forEach((b, index) => {
                b.position.add(b.userData.velocity);
                b.userData.life--;
                if (b.userData.life <= 0) {
                    scene.remove(b);
                    bullets.splice(index, 1);
                }
            });

            // TELECAMERA 3D IN TERZA PERSONA INSEGUIMENTO
            camera.position.x = localPlayer.mesh.position.x;
            camera.position.y = localPlayer.mesh.position.y + 18;
            camera.position.z = localPlayer.mesh.position.z + 22;
            camera.lookAt(localPlayer.mesh.position);

            renderer.render(scene, camera);
        }

        // Ridimensionamento Finestra
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
