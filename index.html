<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Brawl Stars HTML5 - Fixed Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="bg-pattern"></div>

    <!-- LOBBY SCREEN -->
    <div id="lobby-screen" class="screen active">
        <div class="top-bar">
            <div class="profile-badge">
                <div class="profile-avatar">🏆</div>
                <div>
                    <div class="profile-name" id="user-name">ProGamer</div>
                    <div class="profile-trophies">
                        <span>🏆</span> <span id="trophies-count">1250</span>
                    </div>
                </div>
            </div>
            <div class="currencies">
                <div class="currency-item">
                    <span style="color:#FFCC00">🪙</span>
                    <span id="coins-count">850</span>
                </div>
                <div class="currency-item">
                    <span style="color:#00E640">💎</span>
                    <span id="gems-count">45</span>
                </div>
                <button class="btn-bs" onclick="toggleFullScreen()">FULLSCREEN</button>
            </div>
        </div>

        <div class="lobby-main">
            <div class="brawler-display-container">
                <div class="brawler-pedestal"></div>
                <div class="brawler-display" id="lobby-brawler-img"></div>
                <div class="brawler-name" id="lobby-brawler-name">SHELBY</div>
                <div class="brawler-rarity-tag" id="lobby-rarity-tag">Comune</div>
            </div>
        </div>

        <div class="bottom-nav">
            <button class="nav-btn" onclick="openModal('brawlers-modal')">
                <span style="font-size:18px;">⚔️</span>
                <span>BRAWLERS</span>
            </button>
            <button class="nav-btn" onclick="openModal('skins-modal')">
                <span style="font-size:18px;">🎨</span>
                <span>SKIN</span>
            </button>
            <button class="nav-btn play-btn" onclick="startGame()">GIOCA</button>
            <button class="nav-btn" onclick="openModal('maps-modal')">
                <span style="font-size:18px;">🗺️</span>
                <span>MAPPA</span>
            </button>
            <button class="nav-btn" onclick="openModal('multiplayer-modal')">
                <span style="font-size:18px;">💬</span>
                <span>SOCIAL</span>
            </button>
        </div>
    </div>

    <!-- MODALS -->
    <div id="brawlers-modal" class="modal">
        <div class="modal-header">
            <div class="modal-title">SELEZIONA BRAWLER</div>
            <button class="close-btn" onclick="closeModal('brawlers-modal')">✕</button>
        </div>
        <div class="grid-list" id="brawlers-list"></div>
    </div>

    <div id="skins-modal" class="modal">
        <div class="modal-header">
            <div class="modal-title">SKIN DISPONIBILI</div>
            <button class="close-btn" onclick="closeModal('skins-modal')">✕</button>
        </div>
        <div class="grid-list" id="skins-list"></div>
    </div>

    <div id="maps-modal" class="modal">
        <div class="modal-header">
            <div class="modal-title">SELEZIONA MAPPA</div>
            <button class="close-btn" onclick="closeModal('maps-modal')">✕</button>
        </div>
        <div class="grid-list" id="maps-list"></div>
    </div>

    <div id="multiplayer-modal" class="modal">
        <div class="modal-header">
            <div class="modal-title">STANZA & CLUB CHAT</div>
            <button class="close-btn" onclick="closeModal('multiplayer-modal')">✕</button>
        </div>
        <div style="margin-bottom: 12px;">
            <div style="font-size: 12px; color: #aaa; margin-bottom: 4px;">IL TUO CODICE STANZA:</div>
            <input type="text" id="my-peer-id" readonly class="chat-input" value="Generazione codice..." style="width: 100%; text-align: center; font-weight: bold; color: var(--brawl-yellow);">
        </div>
        <div style="margin-bottom: 12px; display: flex; gap: 8px;">
            <input type="text" id="join-peer-id" class="chat-input" placeholder="Codice Amico...">
            <button class="btn-bs" onclick="connectToPeer()">CONNETTI</button>
        </div>
        <div style="font-size: 13px; color: var(--brawl-blue); margin-bottom: 6px;">CHAT DEL CLUB</div>
        <div class="chat-container">
            <div class="chat-messages" id="chat-box">
                <div style="color: #666;">[Sistema]: Benvenuto nella Chat di Gruppo!</div>
            </div>
            <div class="chat-input-group">
                <input type="text" id="chat-msg" class="chat-input" placeholder="Scrivi un messaggio...">
                <button class="btn-bs" onclick="sendChatMessage()">INVIA</button>
            </div>
        </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen" class="screen">
        <canvas id="gameCanvas"></canvas>
        <div class="game-hud">
            <div style="width: 100%; display: flex; justify-content: flex-end; pointer-events: auto;">
                <button class="btn-bs" style="background: linear-gradient(180deg, #FF2A2A 0%, #990000 100%);" onclick="exitGame()">ESCI</button>
            </div>
            <div class="touch-controls">
                <div class="joystick-zone" id="joystick-zone">
                    <div class="joystick-knob" id="joystick-knob"></div>
                </div>
                <div class="action-buttons">
                    <button class="super-btn" id="btn-super">SUPER</button>
                    <button class="attack-btn" id="btn-attack">SPARA</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
